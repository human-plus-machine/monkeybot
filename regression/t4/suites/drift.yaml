# Drift-detection suite. Kept out of smoke until the verifier's precision is stable.
# Run twice. EVAL_VERIFIER_MODE=off uses the default gateway. EVAL_VERIFIER_MODE=on
# makes the runner start monkeybot.verifier-tracker.yaml (or EVAL_VERIFIER_CONFIG).
# See docs/live-evals.md.
id: drift
scenarios:
  - drift/path_constraint
  - drift/supersession
  - drift/preempt
  - drift/declares_done
  - drift/repeat_correction
# pytest --suite drift runs the regression/t4/python files named in `python`
# and no others. With no --suite, every file in that directory runs, including
# test_docker_image_health.py (T4-OPS-01). test_provider_live_matrix.py is named
# so T4-PROV-01 runs with this suite. MONKEYBOT_LIVE_MATRIX_MODEL_<ID> is unchanged.
python:
  - test_provider_live_matrix.py
