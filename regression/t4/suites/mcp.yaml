# MCP suite against regression/fixtures/mcp/fixture_mcp_server.py. The first three
# scenarios use the default autoConnect config (--agent-url). mcp/enable_then_echo_live
# sets MCP_CONFIG=monkeybot_config/mcp.progressive.json; the runner starts a separate
# gateway for that config. See docs/live-evals.md.
id: mcp
scenarios:
  - mcp/tool_invoke
  - mcp/list_resources
  - mcp/get_prompt
  - mcp/enable_then_echo_live
# pytest --suite mcp runs the regression/t4/python files named in `python`
# and no others. With no --suite, every file in that directory runs, including
# test_docker_image_health.py (T4-OPS-01). test_provider_live_matrix.py is named
# so T4-PROV-01 runs with this suite. MONKEYBOT_LIVE_MATRIX_MODEL_<ID> is unchanged.
python:
  - test_provider_live_matrix.py
