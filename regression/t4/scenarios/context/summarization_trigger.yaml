# The runner starts a gateway with the window below. Summarization fires on its own
# once the prompt crosses SUMMARY_TRIGGER_RATIO * context_window (0.85 * 10000).
# The agent's default window is 128000, which these five turns do not reach.
# Unlisted shell commands ask for confirmation; approving each one (and remembering
# that command) keeps the turn from waiting out the pending-response timeout.
case: T4-CTX-01
mode: live
config:
  model.context_window: 10000
description: "Long multi-turn conversation crosses the real summarization threshold"
tags: [context, summarization]
steps:
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 1}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 2}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 3}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 4}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 5}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 6}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 7}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 8}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 9}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 10}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 11}}
  - {action: confirm_tool, decision: always, reason: record compaction cassette, when: {event: tool_confirmation, nth: 12}}
messages:
  - >
    I'm going to describe a large system in detail over several messages, please keep track.
    Component 1: the ingestion service reads events from a queue, validates schema, deduplicates
    by event id, and writes to a staging table. It retries transient failures up to 5 times with
    exponential backoff, and dead-letters anything that still fails after that. It emits metrics
    for queue lag, validation failure rate, and staging write latency.
  - >
    Component 2: the enrichment service reads from the staging table, joins against a reference
    dataset keyed by account id, and attaches geography, plan tier, and risk score. It caches the
    reference dataset in memory with a 10 minute TTL, and falls back to a direct lookup on cache
    miss. It emits metrics for join hit rate, enrichment latency, and cache hit rate.
  - >
    Component 3: the scoring service takes enriched events, runs them through a rules engine and
    a small ML model, and produces a combined risk score. It batches requests to the model in
    groups of 50 with a 200ms max wait, and falls back to rules-only scoring if the model call
    times out. It emits metrics for model latency, fallback rate, and score distribution.
  - >
    Component 4: the notification service reads scored events above a threshold, groups them by
    account, applies a rate limit per account per hour, and sends alerts via email or webhook
    depending on account preference. It logs every suppressed alert with a reason code. It emits
    metrics for alert volume, suppression rate, and delivery latency by channel.
  - "Given everything I described, what were the retry and fallback behaviors across all four components?"
assertions:
  metrics: [response_relevancy, conversational_coherence]
  min_summarizations: 1
  verdicts: {max: 0}
