# Live counterpart to core_run_command.yaml that exercises the SandboxExecutor
# code path instead of TerminalExecutor. Requires SANDBOX_ENABLED=true and a
# running OpenSandbox server backed by a live Docker daemon (see
# cli/src/monkeybot_cli/scaffold_defaults/opensandbox.docker.toml) — CI has
# no Docker socket wired up for this yet, so this scenario is local-only.
# Not in regression/t4/suites/smoke.yaml;
# run it by adding "shell/core_run_command_sandbox" to a suite yaml's scenarios list and
# booting the regression/t4/agent gateway with SANDBOX_ENABLED=true plus a reachable OpenSandbox
# server — docs/live-evals.md only documents the default SANDBOX_ENABLED=false path, so
# use the opensandbox.docker.toml scaffold referenced above for the backend setup.
# `echo` succeeding here proves the sandbox actually created a container and
# executed a real command inside it, not just that config parsing works.
case: T4-SHELL-02
mode: live
description: "Agent runs a trivial shell command via run_command with SANDBOX_ENABLED=true (real OpenSandbox/Docker backend)"
tags: [tools, local-only]
messages:
  - "Use the shell/run_command tool to run `echo monkeybot-sandbox-check` and tell me exactly what it printed."
assertions:
  metrics: [response_relevancy, faithfulness]
  required_tools: [run_command]
  max_tool_errors: 0
  verdicts: {max: 0}
