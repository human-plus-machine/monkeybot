case: T4-SKILL-01
mode: live
description: "Agent uses an available skill when relevant"
tags: [skills, tools]
messages:
  - "List your available skills"
  - "Use one of those skills to help me"
assertions:
  metrics: [response_relevancy, faithfulness]
  # Deterministic gate: fails if the agent never actually calls list_skills, or never reads a
  # skill's file before using it, regardless of how plausible the judge finds the prose (this
  # was the false-confidence gap in the ticket).
  required_tools: [list_skills, read_file]
  verdicts: {max: 0}
