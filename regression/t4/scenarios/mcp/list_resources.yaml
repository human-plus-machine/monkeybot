# Uses the in-process fixture MCP server wired up in
# regression/t4/agent/monkeybot_config/mcp.json (server "fixture", see
# regression/fixtures/mcp/fixture_mcp_server.py). No network calls, CI-reachable.
case: T4-MCP-02
mode: live
description: "Agent lists and reads an MCP resource from the fixture server"
tags: [mcp]
messages:
  - "The MCP server 'fixture' exposes a resource. List its resources, then read the one you find and tell me what it says."
assertions:
  metrics: [response_relevancy]
  required_tools: [list_mcp_resources, read_mcp_resource]
  tool_calls: {min: 2}
  max_tool_errors: 0
  verdicts: {max: 0}
