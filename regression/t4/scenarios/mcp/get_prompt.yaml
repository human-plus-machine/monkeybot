# Uses the in-process fixture MCP server wired up in
# regression/t4/agent/monkeybot_config/mcp.json (server "fixture", see
# regression/fixtures/mcp/fixture_mcp_server.py). No network calls, CI-reachable.
case: T4-MCP-03
mode: live
description: "Agent lists and fetches an MCP prompt from the fixture server"
tags: [mcp]
messages:
  - "The MCP server 'fixture' exposes a prompt template. List its prompts, then fetch the 'greet' prompt with name='World' and tell me what the resulting prompt text is."
assertions:
  metrics: [response_relevancy]
  required_tools: [list_mcp_prompts, get_mcp_prompt]
  tool_calls: {min: 2}
  max_tool_errors: 0
  verdicts: {max: 0}
