# Generated by regression/t4/gateway.py (monkeybot.yaml {"model": {"context_window": 6000}}); deleted when its gateway stops.
runtime:
  log_level: INFO
  port: 8080
  transcript_enabled: true
paths:
  agent_md: ./monkeybot_config/AGENT.md
  memory_storage_uri: local://./memory
  skills_path: ./skills
  workspace_root: ./workspace
  db_url: sqlite:///data/monkeybot.db
  command_allowlist_config: ./monkeybot_config/command_allowlist.yaml
harness:
  mode: turn_based
model:
  provider: ollama-cloud
  name: glm-5.3-flash
  context_window: 6000
  thinking_budget: -1
gateway:
  pending_response_timeout_sec: 300
  sse_replay_max: 256
  graceful_shutdown_timeout_sec: 5
subagents:
  timeout_sec: 600
  max_turns: 25
web_search:
  backend: duckduckgo
  max_results: 5
sandbox:
  enabled: false
