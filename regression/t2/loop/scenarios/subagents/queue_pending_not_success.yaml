id: regression/t2/loop/scenarios/subagents/queue_pending_not_success
case: T2-SUB-14
description: background task returns running immediately and still emits SubagentStarted
mode: scripted
driver: loop
executor: real
messages:
- Start a background analysis
config:
  env:
    MONKEYBOT_SUBAGENT_SCRIPT: testkit/subagent_worker.py
    AGENT_MD: regression/t4/agent/monkeybot_config/AGENT.md
script:
- - type: tool_call
    call_id: c1
    name: task
    args:
      task: sleep:0.2
      background: true
  - type: done
- - type: text
    text: Started.
  - type: done
assertions:
  required_tools:
  - task
  turn_completed: true
  events_sequence:
  - SubagentStarted
  event_fields:
    ToolCallResult:
      result:
        regex: '"status": "running".*"run_id"'
