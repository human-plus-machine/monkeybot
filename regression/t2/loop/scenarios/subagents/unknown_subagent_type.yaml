id: regression/t2/loop/scenarios/subagents/unknown_subagent_type
case: T2-SUB-05
description: An unknown subagent_type is a validation error and does not spawn
mode: scripted
driver: loop
executor: real
messages:
- Use a persona that is not configured
config:
  env:
    MONKEYBOT_SUBAGENT_SCRIPT: testkit/subagent_worker.py
    AGENT_MD: evals/smoke_agent/monkeybot_config/AGENT.md
script:
- - type: tool_call
    call_id: c1
    name: task
    args:
      task: roundtrip
      subagent_type: missing-persona
  - type: done
- - type: text
    text: That persona is unknown.
  - type: done
assertions:
  required_tools:
  - task
  turn_completed: true
  events_absent:
  - SubagentStarted
  event_fields:
    ToolCallResult:
      error:
        regex: Unknown subagent_type 'missing-persona'
  workspace_command_passes:
  - |
    python -c "from pathlib import Path
    raise SystemExit(0 if not Path('.monkeybot/subagent-runs').exists() else 1)"
