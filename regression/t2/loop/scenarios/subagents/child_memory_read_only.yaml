id: regression/t2/loop/scenarios/subagents/child_memory_read_only
case: T2-SUB-13
description: The task envelope carries the palace URI for the child
mode: scripted
driver: loop
executor: real
hooks:
- memory
memory:
  palace:
  - drawer_id: facts
    content: remembered fact
messages:
- Read the palace from a child
config:
  env:
    MONKEYBOT_SUBAGENT_SCRIPT: testkit/subagent_worker.py
    AGENT_MD: evals/smoke_agent/monkeybot_config/AGENT.md
script:
- - type: tool_call
    call_id: c1
    name: task
    args:
      task: echo
  - type: done
- - type: text
    text: Palace URI forwarded.
  - type: done
assertions:
  required_tools:
  - task
  turn_completed: true
  workspace_file_contains:
    child_echo.json: local://
  workspace_command_passes:
  - |
    python -c "from pathlib import Path
    text = Path('child_echo.json').read_text()
    ok = 'local://' in text and 'mempalace' in text
    raise SystemExit(0 if ok else 1)"
