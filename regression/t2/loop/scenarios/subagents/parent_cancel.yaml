id: regression/t2/loop/scenarios/subagents/parent_cancel
case: T2-SUB-07
description: Cancel while the child is running records task cancelled (parent)
mode: scripted
driver: loop
executor: real
script_partial: true
messages:
- Start a long child and cancel it
config:
  env:
    MONKEYBOT_SUBAGENT_SCRIPT: testkit/subagent_worker.py
    AGENT_MD: evals/smoke_agent/monkeybot_config/AGENT.md
script:
- - type: tool_call
    call_id: c1
    name: task
    args:
      task: hang
  - type: done
- - type: text
    text: Cancelled.
  - type: done
steps:
- action: cancel
  when:
    event: ToolCallStarted
    name: task
assertions:
  required_tools:
  - task
  turn_completed: true
  event_fields:
    ToolCallResult:
      result:
        regex: 'task: cancelled \(parent\)'
