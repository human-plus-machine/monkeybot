id: regression/t2/loop/scenarios/subagents/system_prompt_redacted_on_pipe
case: T2-SUB-10
description: SystemPromptSnapshot text is redacted on the NDJSON pipe
mode: scripted
driver: loop
executor: real
messages:
- Inspect the child system prompt
config:
  env:
    MONKEYBOT_SUBAGENT_SCRIPT: testkit/subagent_worker.py
    AGENT_MD: regression/t4/agent/monkeybot_config/AGENT.md
script:
- - type: tool_call
    call_id: c1
    name: task
    args:
      task: system_prompt
  - type: done
- - type: text
    text: The prompt was redacted.
  - type: done
assertions:
  required_tools:
  - task
  turn_completed: true
  event_fields:
    ToolCallResult:
      result:
        regex: '"ok": true'
  workspace_command_passes:
  - |
    python -c "from pathlib import Path
    text = '\n'.join(p.read_text() for p in Path('.monkeybot/subagent-runs').glob('*/progress.jsonl'))
    ok = '[omitted' in text and 'SUPER_SECRET_PROMPT_TEXT' not in text
    raise SystemExit(0 if ok else 1)"
