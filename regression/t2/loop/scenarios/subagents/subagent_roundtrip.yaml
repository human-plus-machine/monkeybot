id: regression/t2/loop/scenarios/subagents/subagent_roundtrip
case: T2-SUB-01
description: task tool call is recorded and turn completes
mode: scripted
driver: loop
messages:
- Run a background analysis
script:
- - type: tool_call
    call_id: c1
    name: task
    args:
      task: analyse
  - type: done
- - type: text
    text: Analysis complete.
  - type: done
assertions:
  tool_categories_used:
  - subagent
  turn_completed: true
