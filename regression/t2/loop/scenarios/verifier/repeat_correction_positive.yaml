id: regression/t2/loop/scenarios/verifier/repeat_correction_positive
case: T2-VER-07
description: The same path touched after one correction entry emits repeat_correction.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Do not touch db/migrations.
- Apply the migration change.
config:
  verifier:
    enabled: true
    ledger:
      enabled: true
      model: fake
    tracker:
      enabled: true
    judge:
      enabled: false
    escalation:
      max_severity: nudge
  env:
    MONKEYBOT_CLASSIFIER_ROWS: '[{"intent":"correction","relates_to":null,"constraints":[{"kind":"path_glob","pattern":"db/migrations/**","verbatim":"do
      not touch migrations"}]},{"intent":"answer","relates_to":null,"constraints":[]}]'
script:
- - type: text
    text: I will leave migrations alone.
  - type: done
- - type: tool_call
    call_id: c1
    name: write_file
    args:
      path: db/migrations/004_touch.sql
      content: select 1;
  - type: done
- - type: text
    text: Done.
  - type: done
assertions:
  turn_completed: true
  verdicts:
    min: 1
    status_in:
    - drifting
    severity_max: none
    signals_include:
    - repeat_correction
    signals_exclude:
    - write_without_read
    - error_streak
    - rewrite_churn
    - constraint_touch
    - done_unmet
    - no_progress
    - budget_burn
