id: regression/t2/loop/scenarios/verifier/replan_one_turn
case: T2-VER-12
description: 'max_severity replan: one verifier_replan, the next request has no tools, the one after has
  tools.'
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Write two new files and then continue.
config:
  verifier:
    enabled: true
    ledger:
      enabled: false
    tracker:
      enabled: true
    judge:
      enabled: true
      model: fake
    escalation:
      max_severity: replan
  env:
    MONKEYBOT_JUDGE_SCRIPT: '{"completions":[{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"replan\",\"confidence\":0.8,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"}]}'
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: src/models.py
  - type: done
- - type: tool_call
    call_id: c2
    name: write_file
    args:
      path: src/unread_a.py
      content: a
  - type: done
- - type: tool_call
    call_id: c3
    name: write_file
    args:
      path: src/unread_b.py
      content: b
  - type: done
- - type: text
    text: planning
  - type: done
- - type: text
    text: continuing
  - type: done
assertions:
  turn_completed: true
  interventions:
  - verifier_replan
  provider_request:
  - n: 4
    tools_empty: true
    system_contains: Do not call tools this turn.
  - n: 5
    tools_empty: false
