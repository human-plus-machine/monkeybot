id: regression/t2/loop/scenarios/verifier/severity_cap_nudge
case: T2-VER-11
description: A block verdict capped at nudge injects template text, keeps tools, and does not replan.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Write two new files.
config:
  verifier:
    enabled: true
    ledger:
      enabled: false
    tracker:
      enabled: true
    judge:
      enabled: true
      model: fake
    escalation:
      max_severity: nudge
  env:
    MONKEYBOT_JUDGE_SCRIPT: '{"completions":[{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"block\",\"confidence\":0.8,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"}]}'
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: src/models.py
  - type: done
- - type: tool_call
    call_id: c2
    name: write_file
    args:
      path: src/unread_a.py
      content: a
  - type: done
- - type: tool_call
    call_id: c3
    name: write_file
    args:
      path: src/unread_b.py
      content: b
  - type: done
- - type: text
    text: next
  - type: done
- - type: tool_call
    call_id: c4
    name: read_file
    args:
      path: src/unread_a.py
  - type: done
- - type: tool_call
    call_id: c5
    name: read_file
    args:
      path: src/unread_b.py
  - type: done
- - type: text
    text: read both
  - type: done
assertions:
  turn_completed: true
  verdicts:
    min: 1
    status_in:
    - drifting
    severity_max: nudge
    signals_include:
    - write_without_read
  interventions: []
  provider_request:
  - n: 4
    tools_empty: false
    system_contains: A write happened without a prior read of the same path. Read the file first, then
      write.
    system_not_contains: FREEFORM_DROP_ME
