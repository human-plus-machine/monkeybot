id: regression/t2/loop/scenarios/verifier/block_denies_mutating_tools
case: T2-VER-13
description: A current block verdict denies a write and allows a read.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Write a blocked file, then read the model.
config:
  verifier:
    enabled: true
    ledger:
      enabled: false
    tracker:
      enabled: true
    judge:
      enabled: true
      model: fake
    escalation:
      max_severity: block
  env:
    MONKEYBOT_JUDGE_SCRIPT: '{"completions":[{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"block\",\"confidence\":0.9,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"}]}'
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: src/models.py
  - type: done
- - type: tool_call
    call_id: c2
    name: write_file
    args:
      path: src/unread_a.py
      content: a
  - type: done
- - type: tool_call
    call_id: c3
    name: write_file
    args:
      path: src/unread_b.py
      content: b
  - type: done
- - type: tool_call
    call_id: c4
    name: write_file
    args:
      path: src/blocked.py
      content: nope
  - type: done
- - type: tool_call
    call_id: c5
    name: read_file
    args:
      path: src/models.py
  - type: done
- - type: text
    text: Done.
  - type: done
assertions:
  turn_completed: true
  verdicts:
    min: 1
    severity_max: block
    status_in:
    - drifting
  workspace_file_absent:
  - src/blocked.py
  events_sequence:
  - type: ToolCallResult
    tool: write_file
    error:
      regex: Read the file first
  - type: ToolCallResult
    tool: read_file
    error: null
