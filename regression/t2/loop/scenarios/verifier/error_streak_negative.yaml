id: regression/t2/loop/scenarios/verifier/error_streak_negative
case: T2-VER-02
description: Two tool failures emit nothing.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Read two missing files.
config:
  verifier:
    enabled: true
    ledger:
      enabled: false
    tracker:
      enabled: true
    judge:
      enabled: false
    escalation:
      max_severity: nudge
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: missing_a.txt
  - type: done
- - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: missing_b.txt
  - type: done
- - type: text
    text: Done.
  - type: done
assertions:
  turn_completed: true
  verdicts:
    max: 0
