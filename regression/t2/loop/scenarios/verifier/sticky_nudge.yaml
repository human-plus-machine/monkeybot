id: regression/t2/loop/scenarios/verifier/sticky_nudge
case: T2-VER-15
description: The nudge stays in later provider requests until the unread path is read.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Write a new file, then read it back.
config:
  verifier:
    enabled: true
    ledger:
      enabled: false
    tracker:
      enabled: true
    judge:
      enabled: true
      model: fake
    escalation:
      max_severity: nudge
  env:
    MONKEYBOT_JUDGE_SCRIPT: '{"completions":[{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"nudge\",\"confidence\":0.8,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"}]}'
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: src/models.py
  - type: done
- - type: tool_call
    call_id: c2
    name: write_file
    args:
      path: src/unread_a.py
      content: a
  - type: done
- - type: tool_call
    call_id: c3
    name: write_file
    args:
      path: src/unread_a.py
      content: b
  - type: done
- - type: text
    text: still going
  - type: done
- - type: text
    text: still nudged
  - type: done
- - type: tool_call
    call_id: c4
    name: read_file
    args:
      path: src/unread_a.py
  - type: done
- - type: text
    text: recovered
  - type: done
assertions:
  turn_completed: true
  provider_request:
  - n: 4
    system_contains: A write happened without a prior read of the same path. Read the file first, then
      write.
  - n: 5
    system_contains: A write happened without a prior read of the same path. Read the file first, then
      write.
  - n: 7
    system_not_contains: Read the file first, then write.
