id: regression/t2/loop/scenarios/verifier/judge_rate_limits
case: T2-VER-20
description: max_verdicts_per_message 1 and min_turns_between_verdicts 2 allow only the first verdict.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
- verifier
messages:
- Fail several reads.
config:
  verifier:
    enabled: true
    ledger:
      enabled: false
    tracker:
      enabled: true
    judge:
      enabled: true
      model: fake
      max_verdicts_per_message: 1
      min_turns_between_verdicts: 2
    escalation:
      max_severity: nudge
  env:
    MONKEYBOT_JUDGE_SCRIPT: '{"completions":[{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"nudge\",\"confidence\":0.8,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"},{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"nudge\",\"confidence\":0.8,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"},{"mode":"valid","body":"{\"status\":\"drifting\",\"severity\":\"nudge\",\"confidence\":0.8,\"rationale\":\"write_without_read\",\"correction\":\"FREEFORM_DROP_ME\"}"}]}'
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: missing_a.txt
  - type: done
- - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: missing_b.txt
  - type: done
- - type: tool_call
    call_id: c3
    name: read_file
    args:
      path: missing_c.txt
  - type: done
- - type: tool_call
    call_id: c4
    name: read_file
    args:
      path: missing_d.txt
  - type: done
- - type: tool_call
    call_id: c5
    name: read_file
    args:
      path: missing_e.txt
  - type: done
- - type: text
    text: Done.
  - type: done
assertions:
  turn_completed: true
  verdicts:
    min: 1
    max: 1
