id: regression/t2/loop/scenarios/shell/bg_start_await_cursor
case: T2-SHELL-11
description: A background command is paged by two await_command calls without repeating the prefix
mode: scripted
driver: loop
executor: real
config:
  env:
    SANDBOX_ENABLED: "false"
messages:
- Start a long log and page it.
script:
- - type: tool_call
    call_id: c1
    name: run_command
    args:
      argv:
      - python
      - -c
      - |
        import sys
        sys.stdout.buffer.write(b"PAGE1-PREFIX\n" + (b"x" * 20000) + b"\nPAGE2-TAIL\n")
        sys.stdout.buffer.flush()
      background: true
      timeout: 30
  - type: done
- - type: tool_call
    call_id: c2
    name: await_command
    args:
      job_id: "{job_id}"
      cursor: 0
      wait_seconds: 15
  - type: done
- - type: tool_call
    call_id: c3
    name: await_command
    args:
      job_id: "{job_id}"
      cursor: 16384
      wait_seconds: 5
  - type: done
- - type: text
    text: The second page did not repeat the prefix.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    call_id: c1
    result:
      regex: '"background": true'
  - type: ToolCallResult
    call_id: c2
    result:
      regex: PAGE1-PREFIX
  - type: ToolCallResult
    call_id: c3
    result:
      regex: '(?s)^(?!.*PAGE1-PREFIX).*PAGE2-TAIL.*"has_more": false'
  turn_completed: true
  no_errors: true
