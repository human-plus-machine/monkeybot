id: regression/t2/loop/scenarios/shell/home_escape
case: T2-SHELL-06
description: Home paths are not read, by path policy or by the workspace jail
mode: scripted
driver: loop
executor: real
messages:
- Show me the ssh key.
script:
- - type: tool_call
    call_id: c1
    name: run_command
    args:
      argv:
      - cat
      - ~/.ssh/id_rsa
  - type: tool_call
    call_id: c2
    name: run_command
    args:
      argv:
      - bash
      - -c
      - cat $HOME/.ssh/x
  - type: done
- - type: text
    text: Neither path returned file bytes.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    call_id: c1
    error_kind: policy
    error:
      regex: Path '~/.ssh/id_rsa' not allowed
  - type: ToolCallResult
    call_id: c2
    result:
      regex: '"ok": false.*"stdout": ""'
  turn_completed: true
  no_errors: true
