id: regression/t2/loop/scenarios/shell/large_stdout_spill_keeps_exit
case: T2-SHELL-10
description: Huge stdout is spilled and the real exit code is kept
mode: scripted
driver: loop
executor: real
messages:
- Print a huge stdout and exit 3.
script:
- - type: tool_call
    call_id: c1
    name: run_command
    args:
      argv:
      - python
      - -c
      - import sys; sys.stdout.write("Y"*70000); raise SystemExit(3)
  - type: done
- - type: text
    text: The output spilled and the exit code was 3.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    call_id: c1
    result:
      regex: '"exit_code": 3, "output_path":'
  turn_completed: true
  no_errors: true
