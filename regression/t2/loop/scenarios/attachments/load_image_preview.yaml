id: regression/t2/loop/scenarios/attachments/load_image_preview
case: T2-ATT-01
description: Attachment reference triggers load_file tool
mode: scripted
driver: loop
messages:
- Take a look at the screenshot I attached and describe what's in it.
script:
- - type: tool_call
    call_id: c1
    name: load_file
    args:
      attachment_id: att-123
  - type: done
- - type: text
    text: The screenshot shows a login form.
  - type: done
assertions:
  tool_categories_used:
  - attachment
  turn_completed: true
