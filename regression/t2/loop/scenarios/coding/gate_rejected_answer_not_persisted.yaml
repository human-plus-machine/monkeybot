id: regression/t2/loop/scenarios/coding/gate_rejected_answer_not_persisted
case: T2-CODE-13
description: A rejected final answer is not persisted; the accepted retry is the only assistant text row
mode: scripted
driver: loop
executor: recording
hooks:
  - verification_gate
messages:
  - Edit the module.
script:
  - - type: tool_call
      call_id: w1
      name: write_file
      args:
        path: a.py
        content: "x = 1\n"
    - type: done
  - - type: text
      text: REJECTED-NOT-IN-HISTORY
    - type: done
  - - type: text
      text: ACCEPTED-IN-HISTORY
    - type: done
tool_results:
  w1:
    ok: true
assertions:
  interventions:
    - final_answer_gate
  provider_calls: 3
  response_contains: ACCEPTED-IN-HISTORY
  response_not_contains: REJECTED-NOT-IN-HISTORY
  history:
    row_count: 4
    roles:
      - user
      - assistant
      - user
      - assistant
    tool_pairs_intact: true
  turn_completed: true
