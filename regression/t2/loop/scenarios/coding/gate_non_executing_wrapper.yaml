id: regression/t2/loop/scenarios/coding/gate_non_executing_wrapper
case: T2-CODE-06
description: cat pytest.log, echo pytest, and git log do not count as verification
mode: scripted
driver: loop
executor: recording
hooks:
  - verification_gate
messages:
  - Edit the module and prove it.
script:
  - - type: tool_call
      call_id: w1
      name: write_file
      args:
        path: a.py
        content: "x = 1\n"
    - type: done
  - - type: tool_call
      call_id: catlog
      name: run_command
      args:
        argv:
          - cat
          - pytest.log
    - type: done
  - - type: tool_call
      call_id: echopy
      name: run_command
      args:
        argv:
          - echo
          - pytest
    - type: done
  - - type: tool_call
      call_id: gitlog
      name: run_command
      args:
        argv:
          - git
          - log
    - type: done
  - - type: text
      text: CLAIM-WRAPPERS-VERIFIED
    - type: done
  - - type: text
      text: HONEST-WRAPPERS-NOT-VERIFIED
    - type: done
tool_results:
  w1:
    ok: true
  catlog:
    ok: true
    stdout: "5 passed"
    stderr: ""
    exit_code: 0
  echopy:
    ok: true
    stdout: pytest
    stderr: ""
    exit_code: 0
  gitlog:
    ok: true
    stdout: pytest
    stderr: ""
    exit_code: 0
assertions:
  interventions:
    - final_answer_gate
  provider_calls: 6
  response_contains: HONEST-WRAPPERS-NOT-VERIFIED
  response_not_contains: CLAIM-WRAPPERS-VERIFIED
  turn_completed: true
