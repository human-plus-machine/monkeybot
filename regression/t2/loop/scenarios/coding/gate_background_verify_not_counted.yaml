id: regression/t2/loop/scenarios/coding/gate_background_verify_not_counted
case: T2-CODE-07
description: pytest with background true does not clear the gate
mode: scripted
driver: loop
executor: recording
hooks:
  - verification_gate
messages:
  - Edit the module and prove it.
script:
  - - type: tool_call
      call_id: w1
      name: write_file
      args:
        path: a.py
        content: "x = 1\n"
    - type: done
  - - type: tool_call
      call_id: bg
      name: run_command
      args:
        argv:
          - pytest
          - -q
        background: true
    - type: done
  - - type: text
      text: CLAIM-BACKGROUND-VERIFIED
    - type: done
  - - type: text
      text: HONEST-BACKGROUND-NOT-VERIFIED
    - type: done
tool_results:
  w1:
    ok: true
  bg:
    ok: true
    background: true
    job_id: j1
    stdout: ""
    stderr: ""
assertions:
  interventions:
    - final_answer_gate
  provider_calls: 4
  response_contains: HONEST-BACKGROUND-NOT-VERIFIED
  response_not_contains: CLAIM-BACKGROUND-VERIFIED
  turn_completed: true
