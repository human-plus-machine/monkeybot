id: regression/t2/loop/scenarios/coding/git_env_isolation
case: T2-CODE-16
description: GIT_DIR pointing at another repo does not change the workspace git note
mode: scripted
driver: loop
executor: real
hooks:
  - git_context
config:
  env:
    GIT_DIR: "{workspace}/other/.git"
    GIT_WORK_TREE: "{workspace}/other"
messages:
  - What is the git status?
script:
  - - type: text
      text: Noted the workspace branch.
    - type: done
assertions:
  provider_calls: 1
  provider_request:
    - n: 1
      messages_contain: "## Runtime notes"
      system_not_contains: "## Runtime notes"
    - n: 1
      messages_contain: "git: branch workspace-branch"
    - n: 1
      messages_contain: only_workspace.py
    - n: 1
      messages_not_contain: other-branch
    - n: 1
      messages_not_contain: only_other.py
  response_contains: Noted the workspace branch.
  turn_completed: true
  no_errors: true
