id: regression/t2/loop/scenarios/todo/caps
case: T2-TODO-03
description: A 501-character item and the 51st item are rejected and do not change the list.
mode: scripted
driver: loop
executor: real
messages:
  - Add one item that is too long, fill the list, then add one past the cap.
script:
  - - type: tool_call
      call_id: long
      name: todo_list
      args:
        action: add
        text: ""
    - type: done
  - - type: tool_call
      call_id: batch
      name: todo_list
      args:
        action: add
        text:
          - n01
          - n02
          - n03
          - n04
          - n05
          - n06
          - n07
          - n08
          - n09
          - n10
          - n11
          - n12
          - n13
          - n14
          - n15
          - n16
          - n17
          - n18
          - n19
          - n20
          - n21
          - n22
          - n23
          - n24
          - n25
          - n26
          - n27
          - n28
          - n29
          - n30
          - n31
          - n32
          - n33
          - n34
          - n35
          - n36
          - n37
          - n38
          - n39
          - n40
          - n41
          - n42
          - n43
          - n44
          - n45
          - n46
          - n47
          - n48
          - n49
          - n50
    - type: done
  - - type: tool_call
      call_id: extra
      name: todo_list
      args:
        action: add
        text: one more
    - type: done
  - - type: text
      text: Both over-limit adds were rejected.
    - type: done
assertions:
  turn_completed: true
  events_sequence:
    - type: ToolCallResult
      call_id: long
      result:
        regex: exceeds 500
    - type: ToolCallResult
      call_id: batch
      result:
        regex: '"ok": true.*"id": "t50"'
    - type: ToolCallResult
      call_id: extra
      result:
        regex: 'exceed max 50.*"id": "t50"'
