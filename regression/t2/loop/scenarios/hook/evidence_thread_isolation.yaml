id: regression/t2/loop/scenarios/hook/evidence_thread_isolation
case: T2-HOOK-11
description: A read in session A does not satisfy a citation in session B.
mode: scripted
driver: loop
executor: recording
workspace_fixture: drift_ws
hooks:
  - evidence_guard
sessions:
  - - Read the model.
  - - Cite the model.
script:
  - - type: tool_call
      call_id: a1
      name: read_file
      args:
        path: src/models.py
    - type: done
  - - type: text
      text: Read src/models.py.
    - type: done
  - - type: text
      text: "Evidence: src/models.py"
    - type: tool_call
      call_id: b1
      name: read_file
      args:
        path: DONE.txt
    - type: done
  - - type: text
      text: Noted.
    - type: done
assertions:
  provider_calls: 4
  provider_request:
    - n: 2
      system_not_contains: "## Evidence verification required"
    - n: 4
      system_contains: "## Evidence verification required"
    - n: 4
      system_contains: src/models.py
  turn_completed: true
  no_errors: true
