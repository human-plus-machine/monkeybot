id: regression/t2/loop/scenarios/hook/secret_redacted_interactive
case: T2-HOOK-12
description: A canary in a tool result is withheld and the interactive turn continues.
mode: scripted
driver: loop
executor: recording
hooks:
  - secret_scanner
messages:
  - Read the notes.
tool_results:
  c1:
    text: mb-hook-canary
script:
  - - type: tool_call
      call_id: c1
      name: read_file
      args:
        path: notes.txt
    - type: done
  - - type: text
      text: Continued after the redaction.
    - type: done
assertions:
  events_sequence:
    - CredentialEgressBlocked
  provider_calls: 2
  provider_request:
    - n: 2
      messages_contain: "[withheld: credential detected]"
  turn_completed: true
  no_errors: true
