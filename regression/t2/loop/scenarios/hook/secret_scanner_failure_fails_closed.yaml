id: regression/t2/loop/scenarios/hook/secret_scanner_failure_fails_closed
case: T2-HOOK-14
description: When the scanner raises, the content is withheld and the turn continues.
mode: scripted
driver: loop
executor: recording
hooks:
  - secret_scanner
config:
  env:
    MB_SECRET_SCANNER: raise
messages:
  - Read the notes.
tool_results:
  c1:
    text: mb-hook-canary
script:
  - - type: tool_call
      call_id: c1
      name: read_file
      args:
        path: notes.txt
    - type: done
  - - type: text
      text: Continued after the scanner failure.
    - type: done
assertions:
  events_sequence:
    - CredentialEgressBlocked
  provider_calls: 2
  provider_request:
    - n: 2
      messages_contain: "[withheld: credential detected]"
  turn_completed: true
  no_errors: true
