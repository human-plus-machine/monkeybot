id: regression/t2/loop/scenarios/hook/evidence_grep_only_not_accepted
case: T2-HOOK-10
description: A file seen only through grep still counts as unverified.
mode: scripted
driver: loop
executor: recording
workspace_fixture: drift_ws
hooks:
  - evidence_guard
messages:
  - Search then cite.
script:
  - - type: tool_call
      call_id: c1
      name: grep
      args:
        pattern: class
        path: src/models.py
    - type: done
  - - type: text
      text: "Evidence: src/models.py"
    - type: tool_call
      call_id: c2
      name: read_file
      args:
        path: DONE.txt
    - type: done
  - - type: text
      text: Still unverified.
    - type: done
assertions:
  provider_calls: 3
  provider_request:
    - n: 3
      system_contains: "## Evidence verification required"
    - n: 3
      system_contains: src/models.py
  turn_completed: true
  no_errors: true
