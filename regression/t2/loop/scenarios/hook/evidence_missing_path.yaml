id: regression/t2/loop/scenarios/hook/evidence_missing_path
case: T2-HOOK-08
description: A missing Evidence path is corrected on the next request, once.
mode: scripted
driver: loop
executor: recording
workspace_fixture: drift_ws
hooks:
  - evidence_guard
messages:
  - Cite the evidence.
script:
  - - type: text
      text: "Evidence: missing.py"
    - type: tool_call
      call_id: c1
      name: read_file
      args:
        path: DONE.txt
    - type: done
  - - type: text
      text: Looking.
    - type: tool_call
      call_id: c2
      name: read_file
      args:
        path: DONE.txt
    - type: done
  - - type: text
      text: Done.
    - type: done
assertions:
  provider_calls: 3
  provider_request:
    - n: 2
      system_contains: "## Evidence path correction"
    - n: 2
      system_contains: missing.py
    - n: 3
      system_not_contains: "## Evidence path correction"
  turn_completed: true
  no_errors: true
