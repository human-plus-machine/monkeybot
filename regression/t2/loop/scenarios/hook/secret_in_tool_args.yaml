id: regression/t2/loop/scenarios/hook/secret_in_tool_args
case: T2-HOOK-15
description: A canary in write_file content is refused and the file is not created.
mode: scripted
driver: loop
executor: real
workspace_fixture: drift_ws
hooks:
  - secret_scanner
messages:
  - Write the leak.
script:
  - - type: tool_call
      call_id: c1
      name: write_file
      args:
        path: leak.txt
        content: "prefix mb-hook-canary suffix"
    - type: done
  - - type: text
      text: stopped
    - type: done
assertions:
  event_fields:
    ToolCallResult:
      error_kind: credential_egress_blocked
  workspace_file_absent: leak.txt
  events_sequence:
    - CredentialEgressBlocked
  provider_calls: 2
  turn_completed: true
  no_errors: true
