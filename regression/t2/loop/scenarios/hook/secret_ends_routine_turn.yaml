id: regression/t2/loop/scenarios/hook/secret_ends_routine_turn
case: T2-HOOK-13
description: A routine run ends when a canary is detected, with no second provider call.
mode: scripted
driver: loop
executor: recording
script_partial: true
hooks:
  - secret_scanner
config:
  env:
    MONKEYBOT_RUN_KIND: routine
messages:
  - Read the notes.
tool_results:
  c1:
    text: mb-hook-canary
script:
  - - type: tool_call
      call_id: c1
      name: read_file
      args:
        path: notes.txt
    - type: done
  - - type: text
      text: This second call must not run.
    - type: done
assertions:
  provider_calls: 1
  error_contains: "Blocked: a canary was detected"
  events_sequence:
    - CredentialEgressBlocked
    - Error
  turn_completed: true
