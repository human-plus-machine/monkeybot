id: regression/t2/loop/scenarios/loop/confirm_approve
case: T2-LOOP-23
description: Approving a confirmation runs the tool once and the turn finishes.
mode: scripted
driver: loop
messages:
- read a file
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: a.txt
  - type: done
- - type: text
    text: approved
  - type: done
steps:
- action: confirm_tool
  decision: approve
  call_id: c1
  when:
    event: tool_confirmation
    call_id: c1
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 2
  tool_calls:
    read_file: 1
  events_sequence:
  - type: ToolConfirmationRequest
    tool_call_id: c1
  - type: ToolCallResult
    call_id: c1
    result: ok
    error: null
  response_contains: approved
