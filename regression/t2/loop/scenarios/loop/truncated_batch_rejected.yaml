id: regression/t2/loop/scenarios/loop/truncated_batch_rejected
case: T2-LOOP-04
description: A truncated tool batch is rejected as a whole and none of the calls execute.
mode: scripted
driver: loop
messages:
- call two tools
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: a.txt
  - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: b.txt
  - type: done
    truncated: true
- - type: text
    text: continued after truncation
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 2
  tool_calls:
    read_file: 2
  interventions:
  - intervention: truncated_batch
    detail: stream_truncated
  events_sequence:
  - type: ToolCallResult
    call_id: c1
    error:
      regex: was not executed
  - type: ToolCallResult
    call_id: c2
    error:
      regex: was not executed
