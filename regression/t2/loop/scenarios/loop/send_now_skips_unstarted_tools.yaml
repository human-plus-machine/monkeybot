id: regression/t2/loop/scenarios/loop/send_now_skips_unstarted_tools
case: T2-LOOP-45
description: Send now stops every tool in the batch that has not finished, including ones that have not started.
mode: scripted
driver: loop
messages:
- read two files
script:
- - type: tool_call
    call_id: r1
    name: read_file
    args:
      path: a.txt
  - type: tool_call
    call_id: r2
    name: read_file
    args:
      path: b.txt
  - type: done
- - type: text
    text: steered reply
  - type: done
tool_results:
  r1:
    hang: true
  r2:
    hang: true
steps:
- action: queue_follow_up
  request_id: q-now
  text: steer-now
  when:
    event: ToolCallStarted
    nth: 1
- action: promote_follow_up
  request_id: q-now
  when:
    event: ToolCallStarted
    nth: 1
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 2
  events_sequence:
  - type: ToolCallResult
    call_id: r1
    error:
      regex: stopped because the user sent a new message
  - type: ToolCallResult
    call_id: r2
    error:
      regex: stopped because the user sent a new message
  - type: UserSteered
    text: steer-now
  history:
    no_repaired_rows: true
    tool_pairs_intact: true
