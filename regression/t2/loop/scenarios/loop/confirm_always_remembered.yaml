id: regression/t2/loop/scenarios/loop/confirm_always_remembered
case: T2-LOOP-26
description: An always approval of an unknown command skips confirmation for the same command later in
  the turn.
mode: scripted
driver: loop
config:
  env:
    PENDING_RESPONSE_TIMEOUT_SEC: '1'
policy:
  command_allowlist: default
messages:
- run date twice
script:
- - type: tool_call
    call_id: c1
    name: run_command
    args:
      argv:
      - date
  - type: tool_call
    call_id: c2
    name: run_command
    args:
      argv:
      - date
  - type: done
- - type: text
    text: both ran
  - type: done
steps:
- action: confirm_tool
  decision: always
  call_id: c1
  when:
    event: tool_confirmation
    call_id: c1
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 2
  tool_calls:
    run_command: 2
  events_sequence:
  - type: ToolConfirmationRequest
    tool_call_id: c1
    tool_name: run_command
  - type: ToolCallResult
    call_id: c1
    result: ok
    error: null
  - type: ToolCallResult
    call_id: c2
    result: ok
    error: null
