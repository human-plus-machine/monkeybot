id: regression/t2/loop/scenarios/loop/confirm_timeout
case: T2-LOOP-25
description: A confirmation that is not answered before the timeout is abandoned and the tool does not
  run.
mode: scripted
driver: loop
config:
  env:
    PENDING_RESPONSE_TIMEOUT_SEC: '0'
messages:
- read a file
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: a.txt
  - type: done
- - type: text
    text: continued
  - type: done
steps:
- action: confirm_tool
  decision: approve
  call_id: c1
  when:
    event: text
    nth: 1
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 2
  events_sequence:
  - type: ToolCallResult
    call_id: c1
    error:
      regex: user did not respond within 0s
  response_contains: continued
