- - type: tool_call
    call_id: r01
    name: read_file
    args:
      path: p01
  - type: tool_call
    call_id: r02
    name: read_file
    args:
      path: p02
  - type: tool_call
    call_id: r03
    name: read_file
    args:
      path: p03
  - type: tool_call
    call_id: r04
    name: read_file
    args:
      path: p04
  - type: tool_call
    call_id: r05
    name: read_file
    args:
      path: p05
  - type: tool_call
    call_id: r06
    name: read_file
    args:
      path: p06
  - type: tool_call
    call_id: r07
    name: read_file
    args:
      path: p07
  - type: tool_call
    call_id: r08
    name: read_file
    args:
      path: p08
  - type: tool_call
    call_id: r09
    name: read_file
