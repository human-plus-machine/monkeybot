id: regression/t2/loop/scenarios/store/compaction_reset_row_ids
case: T2-STORE-01
description: After a scripted compaction, load has the summary row and the tail row ids.
mode: scripted
driver: loop
config:
  model.context_window: 4000
messages:
- go
history:
- role: user
  row_id: head-kept
  content:
  - type: text
    text: head
- role: user
  row_id: mid-dropped
  content:
  - type: text
    text: 
- role: user
  row_id: tail-a
  content:
  - type: text
    text: tail-a
- role: assistant
  row_id: tail-b
  content:
  - type: text
    text: tail-b
script:
- - type: text
    text: summary-body
  - type: done
- - type: text
    text: kept-tail
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  history:
    summary_row: true
    row_ids_preserved:
    - tail-a
    - tail-b
