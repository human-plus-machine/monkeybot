id: regression/t2/loop/scenarios/mcp/idle_hides_after_ten
case: T2-MCP-12
description: Ten inner turns that offer fixture__echo but do not call it hide the server. The next request drops the tool and the tool result carries the note.
mode: scripted
driver: loop
executor: real
messages:
- List directories without touching the fixture MCP server.
config:
  model:
    max_turns: 30
  env:
    MCP_CONFIG: regression/fixtures/configs/mcp.progressive.json
script:
- - type: tool_call
    call_id: c0
    name: enable_mcp
    args:
      name: fixture
  - type: done
- - type: tool_call
    call_id: c1
    name: list_dir
    args:
      path: .
      nonce: 0
  - type: done
- - type: tool_call
    call_id: c2
    name: list_dir
    args:
      path: .
      nonce: 1
  - type: done
- - type: tool_call
    call_id: c3
    name: list_dir
    args:
      path: .
      nonce: 2
  - type: done
- - type: tool_call
    call_id: c4
    name: list_dir
    args:
      path: .
      nonce: 3
  - type: done
- - type: tool_call
    call_id: c5
    name: list_dir
    args:
      path: .
      nonce: 4
  - type: done
- - type: tool_call
    call_id: c6
    name: list_dir
    args:
      path: .
      nonce: 5
  - type: done
- - type: tool_call
    call_id: c7
    name: list_dir
    args:
      path: .
      nonce: 6
  - type: done
- - type: tool_call
    call_id: c8
    name: list_dir
    args:
      path: .
      nonce: 7
  - type: done
- - type: tool_call
    call_id: c9
    name: list_dir
    args:
      path: .
      nonce: 8
  - type: done
- - type: tool_call
    call_id: c10
    name: list_dir
    args:
      path: .
      nonce: 9
  - type: done
- - type: text
    text: "Done listing."
  - type: done
assertions:
  provider_calls: 12
  provider_request:
  - n: 1
    tools_exclude:
    - fixture__echo
  - n: 2
    tools_include:
    - fixture__echo
  - n: 11
    tools_include:
    - fixture__echo
  - n: 12
    tools_exclude:
    - fixture__echo
    messages_contain: "was hidden after 10 turns without use"
  turn_completed: true
  no_errors: true
