id: regression/t2/loop/scenarios/mcp/idle_hides_after_ten
case: T2-MCP-12
description: Ten idle turns leave the server listed. Compaction then drops it, and the next tool result carries the note.
mode: scripted
driver: loop
executor: real
messages:
- List directories without touching the fixture MCP server.
config:
  model:
    max_turns: 30
    context_window: 12000
  env:
    MCP_CONFIG: regression/fixtures/configs/mcp.progressive.json
steps:
- action: touch_file
  path: big.txt
  size: 20000
  fill: Q
  when:
    event: tool_result
    nth: 1
script:
- - type: tool_call
    call_id: c0
    name: enable_mcp
    args:
      name: fixture
  - type: done
- - type: tool_call
    call_id: c1
    name: list_dir
    args:
      path: .
      nonce: 0
  - type: done
- - type: tool_call
    call_id: c2
    name: list_dir
    args:
      path: .
      nonce: 1
  - type: done
- - type: tool_call
    call_id: c3
    name: list_dir
    args:
      path: .
      nonce: 2
  - type: done
- - type: tool_call
    call_id: c4
    name: list_dir
    args:
      path: .
      nonce: 3
  - type: done
- - type: tool_call
    call_id: c5
    name: list_dir
    args:
      path: .
      nonce: 4
  - type: done
- - type: tool_call
    call_id: c6
    name: list_dir
    args:
      path: .
      nonce: 5
  - type: done
- - type: tool_call
    call_id: c7
    name: list_dir
    args:
      path: .
      nonce: 6
  - type: done
- - type: tool_call
    call_id: c8
    name: list_dir
    args:
      path: .
      nonce: 7
  - type: done
- - type: tool_call
    call_id: c9
    name: list_dir
    args:
      path: .
      nonce: 8
  - type: done
- - type: tool_call
    call_id: c10
    name: list_dir
    args:
      path: .
      nonce: 9
  - type: done
- - type: tool_call
    call_id: read-big
    name: read_file
    args:
      path: big.txt
  - type: done
- - type: text
    text: idle-summary-body
  - type: done
- - type: tool_call
    call_id: after-hide
    name: list_dir
    args:
      path: .
      nonce: after
  - type: done
- - type: text
    text: "Hidden."
  - type: done
- - type: tool_call
    call_id: note-carrier
    name: list_dir
    args:
      path: .
      nonce: note
  - type: done
- - type: text
    text: "Note landed."
  - type: done
assertions:
  provider_calls: 17
  provider_request:
  - n: 1
    tools_exclude:
    - fixture__echo
  - n: 2
    tools_include:
    - fixture__echo
  - n: 12
    tools_include:
    - fixture__echo
  - n: 16
    tools_exclude:
    - fixture__echo
  - n: 17
    messages_contain: "because it went unused"
  turn_completed: true
  no_errors: true
