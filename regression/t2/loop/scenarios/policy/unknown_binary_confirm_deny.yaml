id: regression/t2/loop/scenarios/policy/unknown_binary_confirm_deny
case: T2-POL-02
description: Denying an unlisted binary does not execute it.
mode: scripted
driver: loop
executor: real
messages:
- Touch a side-effect file.
policy:
  command_allowlist: default
script:
- - type: tool_call
    call_id: c1
    name: run_command
    args:
      argv:
      - touch
      - side_effect.txt
  - type: done
- - type: text
    text: touch was denied.
  - type: done
steps:
- action: confirm_tool
  decision: deny
  call_id: c1
  when:
    event: tool_confirmation
    call_id: c1
assertions:
  events_sequence:
  - type: ToolConfirmationRequest
    tool_name: run_command
    tool_call_id: c1
  - type: ToolCallResult
    call_id: c1
    error:
      regex: denied by user
  workspace_file_absent:
  - side_effect.txt
  turn_completed: true
  no_errors: true
