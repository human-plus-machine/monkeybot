id: regression/t2/loop/scenarios/policy/granted_folder_credential_denied
case: T2-POL-05
description: A .env inside a granted folder is credential_denied and omitted from grep.
mode: scripted
driver: loop
executor: real
messages:
- Read the granted .env and search the folder.
policy:
  command_allowlist: default
  grants: default
script:
- - type: tool_call
    call_id: c-env
    name: read_file
    args:
      path: "{grant_root}/.env"
  - type: done
- - type: tool_call
    call_id: c-secret
    name: grep
    args:
      pattern: SECRET
      root: "{grant_root}"
      respect_gitignore: false
  - type: done
- - type: tool_call
    call_id: c-notes
    name: grep
    args:
      pattern: folder grant
      root: "{grant_root}"
      respect_gitignore: false
  - type: done
- - type: text
    text: The secret stayed hidden.
  - type: done
assertions:
  tool_error_codes:
  - credential_denied
  events_sequence:
  - type: ToolCallResult
    call_id: c-env
    error:
      regex: '\A(?![\s\S]*not-a-real-secret)[\s\S]*credential_denied'
  - type: ToolCallResult
    call_id: c-secret
    result:
      regex: '\A(?![\s\S]*not-a-real-secret)[\s\S]*"match_count": 0'
  - type: ToolCallResult
    call_id: c-notes
    result:
      regex: '"match_count": 1'
  turn_completed: true
  no_errors: true
