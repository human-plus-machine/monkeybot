id: regression/t2/loop/scenarios/file/grep_invalid_regex
case: T2-FILE-28
description: An invalid grep pattern is invalid_regex.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Search with a bad pattern.
script:
- - type: tool_call
    call_id: c1
    name: grep
    args:
      pattern: "("
