id: regression/t2/loop/scenarios/file/grep_gitignore_default
case: T2-FILE-24
description: Default grep misses secret.txt; respect_gitignore false finds it inside the incomplete scan; nested pkg/.gitignore is scoped.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Search ignored files.
script:
- - type: tool_call
    call_id: c1
    name: grep
    args:
      pattern: HOSTILE_SECRET_TOKEN
  - type: done
- - type: tool_call
    call_id: c2
    name: grep
    args:
      pattern: HOSTILE_SECRET_TOKEN
      respect_gitignore: false
  - type: done
- - type: tool_call
    call_id: c3
    name: grep
    args:
      pattern: NESTED_IGNORE_TOKEN
      root: pkg
  - type: done
- - type: tool_call
    call_id: c4
    name: grep
    args:
      pattern: NESTED_IGNORE_TOKEN
      root: pkg
      respect_gitignore: false
  - type: done
- - type: text
    text: Gitignore was honored, including the nested file.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    error:
      regex: '\A(?![\s\S]*secret\.txt)[\s\S]*incomplete_scan'
  - type: ToolCallResult
    error:
      regex: secret\.txt
  - type: ToolCallResult
    result:
      regex: '\A(?![\s\S]*hidden\.txt)[\s\S]*"matches": \[\]'
  - type: ToolCallResult
    result:
      regex: pkg/hidden\.txt
  turn_completed: true
