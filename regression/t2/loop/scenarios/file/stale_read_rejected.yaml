id: regression/t2/loop/scenarios/file/stale_read_rejected
case: T2-FILE-11
description: touch_file between read and replace is stale_read; a re-read then replace succeeds.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Edit notes.txt after it changes on disk.
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: notes.txt
  - type: done
- - type: tool_call
    call_id: c2
    name: replace_in_file
    args:
      path: notes.txt
      old_string: A note inside the hostile workspace.
      new_string: A note inside the hostile workspace, revised.
  - type: done
- - type: tool_call
    call_id: c3
    name: read_file
    args:
      path: notes.txt
  - type: done
- - type: tool_call
    call_id: c4
    name: replace_in_file
    args:
      path: notes.txt
      old_string: A note inside the hostile workspace.
      new_string: A note inside the hostile workspace, revised.
  - type: done
- - type: text
    text: Revised after re-reading.
  - type: done
steps:
- action: touch_file
  path: notes.txt
  when:
    event: tool_result
    nth: 1
assertions:
  tool_error_codes:
  - stale_read
  workspace_file_contains:
    notes.txt: A note inside the hostile workspace, revised.
  turn_completed: true
