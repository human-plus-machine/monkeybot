id: regression/t2/loop/scenarios/file/patch_move_dest_exists
case: T2-FILE-20
description: Moving a patch onto an existing path is already_exists.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Move notes.txt onto src/app.py.
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: notes.txt
  - type: done
- - type: tool_call
    call_id: c2
    name: apply_patch
    args:
      patch_text: |
        *** Begin Patch
        *** Update File: notes.txt
        *** Move to: src/app.py
        @@
        -A note inside the hostile workspace.
        +moved
        *** End Patch
  - type: done
- - type: text
    text: The move destination already exists.
  - type: done
assertions:
  tool_error_codes:
  - already_exists
  workspace_unchanged:
  - notes.txt
  - src/app.py
  turn_completed: true
