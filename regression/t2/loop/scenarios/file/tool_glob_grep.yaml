id: regression/t2/loop/scenarios/file/tool_glob_grep
case: T2-FILE-33
description: Code discovery request triggers glob then grep tools
mode: scripted
driver: loop
messages:
- Find all Python files that reference `run_scenario` in this repo.
script:
- - type: tool_call
    call_id: c1
    name: glob
    args:
      pattern: '**/*.py'
  - type: done
- - type: tool_call
    call_id: c2
    name: grep
    args:
      pattern: run_scenario
      file_glob: '*.py'
  - type: done
- - type: text
    text: Found matches in the scenario runner and the behavior tests.
  - type: done
assertions:
  tool_categories_used:
  - code_search
  turn_completed: true
