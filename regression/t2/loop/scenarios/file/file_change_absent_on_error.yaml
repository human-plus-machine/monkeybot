id: regression/t2/loop/scenarios/file/file_change_absent_on_error
case: T2-FILE-36
description: A replace that does not land emits no FileChange.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Replace a line that is not in the file.
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: notes.txt
  - type: done
- - type: tool_call
    call_id: c2
    name: replace_in_file
    args:
      path: notes.txt
      old_string: NO_SUCH_TOKEN
      new_string: x
  - type: done
- - type: text
    text: The replace did not land.
  - type: done
assertions:
  tool_error_codes:
  - not_found_replace
  events_absent:
  - FileChange
  workspace_unchanged:
  - notes.txt
  turn_completed: true
