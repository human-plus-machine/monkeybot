id: regression/t2/loop/scenarios/file/read_huge_single_line
case: T2-FILE-07
description: A single line past the char budget is sliced with a marker and has no next_offset.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Read the long line.
script:
- - type: tool_call
    call_id: c1
    name: write_file
    args:
      path: longline.txt
      content: ""
  - type: done
- - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: longline.txt
  - type: done
- - type: text
    text: The line was sliced.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    tool: write_file
  - type: ToolCallResult
    result:
      regex: 'line cut at char budget(?!.*next_offset)'
  turn_completed: true
