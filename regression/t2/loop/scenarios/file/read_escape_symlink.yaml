id: regression/t2/loop/scenarios/file/read_escape_symlink
case: T2-FILE-05
description: Reading link_out/x is path_escape.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Read link_out/x.
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: link_out/x
  - type: done
- - type: text
    text: The symlink is rejected.
  - type: done
assertions:
  tool_error_codes:
  - path_escape
  events_sequence:
  - type: ToolCallResult
    error:
      regex: '\A(?![\s\S]*outside the hostile workspace)[\s\S]*path_escape'
  turn_completed: true
