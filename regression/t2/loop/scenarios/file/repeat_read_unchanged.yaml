id: regression/t2/loop/scenarios/file/repeat_read_unchanged
case: T2-FILE-38
description: A second read of an unchanged file is stored once; the next request has the text once and a stub once.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
config:
  model:
    context_window: 200000
    max_turns: 8
messages:
- Read src/repeat.txt twice.
script:
- - type: tool_call
    call_id: w1
    name: write_file
    args:
      path: src/repeat.txt
      content: "C13-REPEAT-TOKEN\"
  - type: done
- - type: tool_call
    call_id: r1
    name: read_file
    args:
      path: src/repeat.txt
  - type: done
- - type: tool_call
    call_id: r2
    name: read_file
    args:
      path: src/repeat.txt
  - type: done
- - type: text
    text: Read once.
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 4
  response_contains: Read once.
  provider_request:
  - n: 3
    messages_count:
      "     1|C13-REPEAT-TOKEN": 1
    messages_not_contain: so it is not repeated
  - n: 4
    messages_count:
      "     1|C13-REPEAT-TOKEN": 1
      "so it is not repeated": 1
