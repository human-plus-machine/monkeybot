id: regression/t2/loop/scenarios/file/spill_large_tool_output
case: T2-FILE-31
description: Output over the spill threshold returns a spill path, and read_file of that path passes the default line cap.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Produce a large command output and read the spill file.
script:
- - type: tool_call
    call_id: c1
    name: run_command
    args:
      argv:
      - python
      - -c
      - 'print("\n".join(f"line{i}" for i in range(3000)))'
  - type: done
- - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: .monkeybot/spill/loop-scenario/c1-output.txt
  - type: done
- - type: text
    text: Read the spill past the line cap.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    result:
      regex: \.monkeybot/spill/loop-scenario/c1-output\.txt
  - type: ToolCallResult
    result:
      regex: line2999
  turn_completed: true
