id: regression/t2/loop/scenarios/file/tool_read
case: T2-FILE-01
description: Content of a fixture file appears in the read_file result.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- What is in notes.txt?
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: notes.txt
  - type: done
- - type: text
    text: The note is in the workspace.
  - type: done
assertions:
  events_sequence:
  - type: ToolCallResult
    result:
      regex: 'A note inside the hostile workspace'
  turn_completed: true
