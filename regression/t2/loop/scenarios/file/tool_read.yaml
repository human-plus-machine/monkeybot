id: regression/t2/loop/scenarios/file/tool_read
case: T2-FILE-01
description: File query triggers a read-category tool
mode: scripted
driver: loop
messages:
- What is in README.md?
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: README.md
  - type: done
- - type: text
    text: Here is the content.
  - type: done
assertions:
  tool_categories_used:
  - read
  turn_completed: true
