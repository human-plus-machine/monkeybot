id: regression/t2/loop/scenarios/file/tool_write
case: T2-FILE-08
description: File edit request triggers a write-category tool
mode: scripted
driver: loop
messages:
- Create a file named notes.txt with the text 'hello'.
script:
- - type: tool_call
    call_id: c1
    name: write_file
    args:
      path: notes.txt
      content: hello
  - type: done
- - type: text
    text: Done, I created notes.txt.
  - type: done
assertions:
  tool_categories_used:
  - write
  turn_completed: true
