id: regression/t2/loop/scenarios/file/tool_replace_apply_patch
case: T2-FILE-17
description: replace_in_file and apply_patch both land.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Edit notes.txt and src/app.py.
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: notes.txt
  - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: src/app.py
  - type: done
- - type: tool_call
    call_id: c3
    name: replace_in_file
    args:
      path: notes.txt
      old_string: A note inside the hostile workspace.
      new_string: A note inside the patched workspace.
  - type: done
- - type: tool_call
    call_id: c4
    name: apply_patch
    args:
      patch_text: |
        *** Begin Patch
        *** Update File: src/app.py
        @@
        -    print("hostile")
        +    print("patched")
        *** End Patch
  - type: done
- - type: text
    text: Both edits landed.
  - type: done
assertions:
  workspace_file_contains:
    notes.txt: A note inside the patched workspace.
    src/app.py: print("patched")
  turn_completed: true
