id: regression/t2/loop/scenarios/file/grep_incomplete_scan
case: T2-FILE-25
description: An oversized file in scope is returned ok with scan_complete false and the file listed in incomplete.skipped_paths.
mode: scripted
driver: loop
executor: real
workspace_fixture: hostile_ws
messages:
- Search huge.txt.
script:
- - type: tool_call
    call_id: c1
    name: grep
    args:
      pattern: H
      file_glob: huge.txt
  - type: done
- - type: text
    text: The scan was incomplete.
  - type: done
assertions:
  tool_error_codes_absent:
  - incomplete_scan
  max_tool_errors: 0
  events_sequence:
  - type: ToolCallResult
    result:
      regex: '"ok": true[\s\S]*"scan_complete": false[\s\S]*"stop_reason": "skipped_files"[\s\S]*"files_skipped_oversized": 1[\s\S]*"skipped_paths": \["huge\.txt"\]'
  turn_completed: true
