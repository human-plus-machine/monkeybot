id: regression/t2/loop/scenarios/computer/clipboard_cap
case: T2-COMP-04
description: A 20001-character clipboard write asks, then writes the full text once approved.
mode: scripted
driver: loop
executor: real
tags:
- darwin-only
messages:
- Write 20001 characters to the clipboard.
config:
  computer:
    enabled: true
  env:
    MONKEYBOT_COMPUTER_TOOLS: "1"
script:
- - type: tool_call
    call_id: c1
    name: computer_clipboard_write
    args:
      text: ""
  - type: done
- - type: text
    text: Written.
  - type: done
steps:
- action: confirm_tool
  decision: approve
  call_id: c1
  when:
    event: tool_confirmation
    call_id: c1
assertions:
  events_sequence:
  - type: ToolConfirmationRequest
    tool_name: computer_clipboard_write
    tool_call_id: c1
    prompt:
      regex: "Allow this action on your computer\\?"
  - type: ToolCallResult
    call_id: c1
    tool: computer_clipboard_write
    error: null
    result:
      regex: "\"chars_written\": 20001"
  turn_completed: true
  no_errors: true
