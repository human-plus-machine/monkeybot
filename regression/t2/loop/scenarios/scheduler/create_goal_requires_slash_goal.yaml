id: regression/t2/loop/scenarios/scheduler/create_goal_requires_slash_goal
case: T2-SCHED-09
description: create_goal without /goal returns an error and writes no goal row.
mode: scripted
driver: loop
executor: real
messages:
- Create a durable goal to watch the deploy.
script:
- - type: tool_call
    call_id: c-plain
    name: create_goal
    args:
      objective: Watch the deploy until it is green.
  - type: done
- - type: text
    text: I cannot create a goal from this message.
  - type: done
assertions:
  turn_completed: true
  provider_calls: 2
  required_tools:
  - create_goal
  store:
    goals: 0
  events_sequence:
  - type: ToolCallResult
    tool: create_goal
    call_id: c-plain
    error:
      regex: 'create_goal is only available when the user invoked /goal'
