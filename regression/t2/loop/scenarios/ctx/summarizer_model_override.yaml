id: regression/t2/loop/scenarios/ctx/summarizer_model_override
case: T2-CTX-07
description: The summary call uses model.summarization_model and does not enable web search.
mode: scripted
driver: loop
config:
  model.context_window: 4000
  model.summarization_model: summarizer-ctx-07
messages:
- go
history:
- role: user
  content:
  - type: text
    text: head-row
- role: user
  content:
  - type: text
    text: |
      
- role: user
  content:
  - type: text
    text: tail-end
script:
- - type: text
    text: summary-body
  - type: done
- - type: text
    text: final-07
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  history:
    summary_row: true
  provider_request:
  - n: 1
    model: summarizer-ctx-07
    tools_empty: true
    no_vertex_google_search: true
    system_contains: Output exactly the Markdown structure
