id: regression/t2/loop/scenarios/ctx/background_summary_stale_fallback
case: T2-CTX-09
description: A rewind shortens history, so the background summary is discarded and
  compaction runs inline.
mode: scripted
driver: loop
config:
  model.context_window: 10000
messages:
- continue
history:
- role: user
  content:
  - type: text
    text: HEAD
- role: assistant
  content:
  - type: text
    text: |
      
- role: user
  content:
  - type: text
    text: tail-a
- role: assistant
  content:
  - type: text
    text: tail-b
- role: user
  content:
  - type: text
    text: tail-c
script:
- - type: text
    text: stale-bg-text
  - type: done
- - type: tool_input_delta
    call_id: c1
    name: read_file
    delta: '{"path":"n.txt"}'
  - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: n.txt
  - type: done
- - type: text
    text: inline-summary-body
  - type: done
- - type: text
    text: final-reply
  - type: done
tool_results:
  c1:
    text: 
steps:
- action: rewind
  through_text: tail-a
  when:
    event: tool_input
    nth: 1
- action: advance_clock
  ms: 60000
  when:
    event: tool_result
    nth: 1
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 4
  history:
    summary_row: true
  events_sequence:
  - ContextSummarizing
  provider_request:
  - n: 4
    messages_contain: inline-summary-body
    messages_not_contain: stale-bg-text
