id: regression/t2/loop/scenarios/ctx/epoch_volatile_update
case: T2-CTX-10
description: A memory-index change between inner turns reports changed_sources memory
  and keeps the stable prefix.
mode: scripted
driver: loop
hooks:
- memory
messages:
- remember
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: a.txt
  - type: done
- - type: tool_call
    call_id: c2
    name: read_file
    args:
      path: b.txt
  - type: done
- - type: text
    text: done-10
  - type: done
tool_results:
  c1:
    text: ok
  c2:
    text: ok
steps:
- action: set_memory_lines
  lines:
  - injected-memory-line-xyz
  when:
    event: tool_result
    nth: 2
assertions:
  turn_completed: true
  no_errors: true
  event_fields:
    SystemContextUpdated:
      changed_sources:
      - memory
  provider_request:
  - n: 2
    system_contains: This block is injected by the host every turn. Prefer the **active
      JSON tool list** for names, parameters, and when-to-use guidance.
  - n: 3
    system_contains: This block is injected by the host every turn. Prefer the **active
      JSON tool list** for names, parameters, and when-to-use guidance.
    messages_contain: injected-memory-line-xyz
