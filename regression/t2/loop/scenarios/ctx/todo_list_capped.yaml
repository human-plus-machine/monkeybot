id: regression/t2/loop/scenarios/ctx/todo_list_capped
case: T2-CTX-22
description: A todo list past 6,000 characters is clipped in the next request, and
  starting an item shows that item in full.
mode: scripted
driver: loop
executor: real
messages:
- Add fifteen long tasks, then start the first one.
script:
- - type: tool_call
    call_id: c1
    name: todo_list
    args:
      action: add
      text:
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
      - 
  - type: done
- - type: tool_call
    call_id: c2
    name: todo_list
    args:
      action: start
      id: t1
  - type: done
- - type: text
    text: The list is capped and the current item is shown in full.
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 3
  tool_categories_used:
  - todo
  provider_request:
  - n: 1
    messages_not_contain: "Long items are clipped"
  - n: 2
    messages_contain: "Long items are clipped. Start an item to see its full text."
    messages_not_contain: "- t1 [pending] "
    system_not_contains: "Long items are clipped"
  - n: 2
    messages_contain: "- t1 [pending]"
  - n: 2
    messages_contain: "- t15 [pending]"
  - n: 3
    messages_contain: "- t1 [in_progress] "
    messages_contain: "Long items are clipped. Start an item to see its full text."
