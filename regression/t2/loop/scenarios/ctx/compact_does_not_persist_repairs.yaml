id: regression/t2/loop/scenarios/ctx/compact_does_not_persist_repairs
case: T2-CTX-03
description: An orphan tool call summarized away is not written back as a repaired
  pair.
mode: scripted
driver: loop
config:
  model.context_window: 4000
messages:
- go
history:
- role: user
  content:
  - type: text
    text: head
- role: assistant
  content:
  - type: toolRequest
    id: orphan
    name: echo
    args: {}
- role: user
  content:
  - type: text
    text: mid-
- role: assistant
  content:
  - type: text
    text: mid-
- role: user
  content:
  - type: text
    text: mid-
- role: assistant
  content:
  - type: text
    text: mid-
- role: user
  content:
  - type: text
    text: tail-a
- role: assistant
  content:
  - type: text
    text: tail-b
script:
- - type: text
    text: sum
  - type: done
- - type: text
    text: final-03
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  history:
    summary_row: true
    no_repaired_rows: true
    tool_pairs_intact: true
