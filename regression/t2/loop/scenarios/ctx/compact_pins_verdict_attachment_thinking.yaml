id: regression/t2/loop/scenarios/ctx/compact_pins_verdict_attachment_thinking
case: T2-CTX-02
description: Compaction keeps the verdict row, the attachment descriptor, and tail thinking.
mode: scripted
driver: loop
config:
  model.context_window: 4000
messages:
- go
history:
- role: user
  content:
  - type: text
    text: head-row
- role: user
  content:
  - type: systemNotification
    notificationType: verifierVerdict
    msg: verdict-kept
- role: user
  content:
  - type: text
    text: |
      [attachment att-pin photo.png (image/png): pinned photo. Call load_file(attachment_id="att-pin") to reload.]
- role: user
  content:
  - type: text
    text: |
      
- role: assistant
  content:
  - type: thinking
    thinking: tail-thought-pin
  - type: text
    text: tail-ok
- role: user
  content:
  - type: text
    text: tail-end
script:
- - type: text
    text: summary-body
  - type: done
- - type: text
    text: final-02
  - type: done
assertions:
  turn_completed: true
  no_errors: true
  history:
    summary_row: true
    blocks_include:
    - type: systemNotification
      notification_type: verifierVerdict
      text_contains: verdict-kept
    - type: text
      text_contains: '[attachment att-pin photo.png (image/png):'
    - type: thinking
      text_contains: tail-thought-pin
