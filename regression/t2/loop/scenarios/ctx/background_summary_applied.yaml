id: regression/t2/loop/scenarios/ctx/background_summary_applied
case: T2-CTX-08
description: A background summary started in the moderate band is applied when the
  prefix still matches.
mode: scripted
driver: loop
config:
  model.context_window: 10000
messages:
- continue
history:
- role: user
  content:
  - type: text
    text: HEAD
- role: assistant
  content:
  - type: text
    text: MID-
- role: user
  content:
  - type: text
    text: tail-a
- role: assistant
  content:
  - type: text
    text: tail-b
script:
- - type: text
    text: bg-summary-text
  - type: done
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: n.txt
  - type: done
- - type: text
    text: final-reply
  - type: done
tool_results:
  c1:
    text: 
steps:
- action: advance_clock
  ms: 60000
  when:
    event: tool_result
    nth: 1
assertions:
  turn_completed: true
  no_errors: true
  provider_calls: 3
  provider_request:
  - n: 3
    messages_contain: bg-summary-text
  history:
    summary_row: true
