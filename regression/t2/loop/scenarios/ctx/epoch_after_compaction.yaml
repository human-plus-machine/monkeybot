id: regression/t2/loop/scenarios/ctx/epoch_after_compaction
case: T2-CTX-12
description: Compaction opens a new context epoch.
mode: scripted
driver: loop
config:
  model.context_window: 4000
messages:
- Read the log
history:
- role: user
  content:
  - type: text
    text: prior-
- role: assistant
  content:
  - type: text
    text: ack-
script:
- - type: tool_call
    call_id: c1
    name: read_file
    args:
      path: log.txt
  - type: done
- - type: text
    text: first-summary-body
  - type: done
- - type: text
    text: second-summary-body
  - type: done
- - type: text
    text: All set.
  - type: done
tool_results:
  c1:
    text: 
assertions:
  turn_completed: true
  no_errors: true
  events_sequence:
  - ContextSummarizing
  - ContextSummarized
  - type: ContextEpochStarted
    epoch_id: 2
