<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signup form</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; max-width: 32rem; }
    label, .row { display: block; margin-top: 0.6rem; }
    input, select, textarea { width: 100%; box-sizing: border-box; }
    textarea { min-height: 4rem; }
    input[type=checkbox] { width: auto; }
    button[disabled] { opacity: 0.5; }
  </style>
</head>
<body>
  <h1>Signup</h1>
  <h2>Submit</h2>
  <p><a href="#docs">Submit</a></p>
  <form id="signup" action="#done" method="get" novalidate>
    <label for="full-name">Full name</label>
    <input id="full-name" name="full-name" placeholder="Your name">

    <input aria-label="Email" type="email">

    <span id="phone-lbl">Phone</span>
    <input aria-labelledby="phone-lbl" type="tel">

    <input placeholder="Address">

    <input name="City">

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Select a country</option>
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="gb">United Kingdom</option>
    </select>

    <input id="zip">

    <div class="row">
      <span>Company</span>
      <input>
    </div>

    <label for="role">Role</label>
    <input id="role" name="role">

    <label for="website">Website</label>
    <input id="website" name="website" type="url">

    <label for="comments">Comments</label>
    <textarea id="comments" name="comments"></textarea>

    <label for="subscribe">Subscribe</label>
    <input id="subscribe" name="subscribe" type="checkbox">

    <input>

    <label for="nickname">Nickname</label>
    <input id="nickname" name="nickname" placeholder="Nickname">

    <p>
      <button type="submit" id="submit" disabled>Submit</button>
    </p>
  </form>
  <p id="status" hidden>Thanks, form submitted.</p>
  <script>
    (function () {
      let nickname = "";
      const el = document.getElementById("nickname");
      const submit = document.getElementById("submit");
      const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
      el.addEventListener("input", function () {
        nickname = el.value;
        proto.set.call(el, nickname);
        submit.disabled = nickname.trim() === "";
      });
      document.getElementById("signup").addEventListener("submit", function (event) {
        event.preventDefault();
        document.getElementById("status").hidden = false;
      });
    })();
  </script>
</body>
</html>
