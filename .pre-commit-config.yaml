# Pre-commit hooks for monkeybot
# Install: uv run pre-commit install && uv run pre-commit install --hook-type pre-push
# Run the commit hooks manually: uv run pre-commit run --all-files
# Run the full pull-request suite: bash scripts/ci-local.sh

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy (src/monkeybot)
        entry: uv run mypy src/monkeybot
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (changed tests or collection check)
        entry: bash scripts/precommit-pytest.sh
        language: system
        files: ^(src/monkeybot|testkit|tests|regression)/.*\.py$
        pass_filenames: true

      - id: local-ci
        name: local CI (ruff format, mypy, pytest, cli, browser MCP, eval self-checks)
        entry: bash scripts/ci-local.sh --if-needed
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
