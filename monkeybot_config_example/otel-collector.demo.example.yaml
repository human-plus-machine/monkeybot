# OTel Collector example — Phoenix only (Langfuse needs LANGFUSE_OTEL_BASIC_AUTH).
# monkeybot: OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#
# For dual export (Phoenix + Langfuse), see otel-collector.demo-dual.example.yaml.
# For a fully commented dual template, see also
# cli/src/monkeybot_cli/scaffold_defaults/otel-collector.example.yaml
#
# Optional: gRPC ingest on 4317 — uncomment protocols.grpc below.
# Optional: memory_limiter processor — uncomment under processors if batches OOM.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      # grpc:
      #   endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # memory_limiter:
  #   check_interval: 1s
  #   limit_mib: 512

exporters:
  otlphttp/phoenix:
    # otlphttp appends /v1/traces — do not include it in endpoint
    endpoint: http://phoenix:6006

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix]
