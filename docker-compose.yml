services:
  monkeybot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: "${EXTRAS:-gemini}"
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      # Uncomment to use a custom config instead of the image default:
      # - ./monkeybot_config:/app/monkeybot_config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
