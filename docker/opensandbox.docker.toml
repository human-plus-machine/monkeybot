# OpenSandbox control plane — default for docker compose sandbox overlay.
# Override path with OPENSANDBOX_CONFIG (e.g. monkeybot_config_example/opensandbox.docker.example.toml).
# Based on OpenSandbox server/opensandbox_server/examples/example.config.toml

[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.16"

[storage]
# Restrictive default for open-source: bind mounts must be under /tmp only.
# For full local dev (repo on your home volume), set OPENSANDBOX_CONFIG to a config with broader allowed_host_paths.
allowed_host_paths = ["/tmp"]
# Required by upstream example.toml for a complete [storage] table (K8s PVC default size).
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/tmp/opensandbox/opensandbox.db"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096
seccomp_profile = ""
apparmor_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.0.11"
mode = "dns"

[renew_intent]
enabled = false
min_interval_seconds = 60
