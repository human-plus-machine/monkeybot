# Compose override — adds OpenSandbox as a sidecar for sandbox-enabled deployments.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker/docker-compose.sandbox.yml up --build
#
# OpenSandbox server config: set OPENSANDBOX_CONFIG in .env to override the default.
# Default config (docker/opensandbox.docker.toml) allows bind-mounts under /tmp only.
#
# Why /tmp/monkeybot-workspace:
#   OpenSandbox bind-mounts the agent workspace path on the HOST Docker daemon.
#   /app/workspace only exists inside the monkeybot container, not on the host.
#   Using /tmp means the same path is mounted into the container AND accessible
#   to the host daemon. The default opensandbox config already allows /tmp.
#
# Memory path:
#   Canonical URI is local:///tmp/monkeybot-memory. On startup the entrypoint
#   migrates a legacy /tmp/monkeybot-data/memory tree into that volume when the
#   new volume is missing or empty — so compose upgrades do not orphan data.
#
# This file overlays only what changes from docker-compose.yml:
#   - Adds the opensandbox-server sidecar
#   - Sets workspace to /tmp/monkeybot-workspace (host-accessible path)
#   - Copies trusted skills to a second host-accessible path for a read-only
#     sandbox mount (the demo image itself still owns /app/skills)
#   - Enables sandbox and points it at the sidecar

services:
  opensandbox-server:
    image: opensandbox/server:latest
    environment:
      - OPENSANDBOX_INSECURE_SERVER=YES
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENSANDBOX_CONFIG:-./docker/opensandbox.docker.toml}:/etc/opensandbox/config.toml:ro
    restart: unless-stopped

  monkeybot:
    environment:
      - SANDBOX_ENABLED=true
      - SANDBOX_SERVER_URL=http://opensandbox-server:8080
      - MONKEYBOT_WORKSPACE_ROOT=/tmp/monkeybot-workspace
      - SKILLS_PATH=/tmp/monkeybot-skills
      - DB_URL=sqlite:////tmp/monkeybot-data/monkeybot.db
      - MEMORY_STORAGE_URI=local:///tmp/monkeybot-memory
    volumes:
      - /tmp/monkeybot-workspace:/tmp/monkeybot-workspace
      - /tmp/monkeybot-skills:/tmp/monkeybot-skills
      - /tmp/monkeybot-data:/tmp/monkeybot-data
      - /tmp/monkeybot-memory:/tmp/monkeybot-memory
    command: >
      sh -c 'set -e;
             LEGACY=/tmp/monkeybot-data/memory;
             DEST=/tmp/monkeybot-memory;
             mkdir -p "$$DEST";
             if [ -d "$$LEGACY" ]; then
               if [ -z "$$(ls -A "$$DEST" 2>/dev/null)" ]; then
                 echo "Migrating legacy memory $$LEGACY -> $$DEST";
                 mv "$$LEGACY"/* "$$DEST"/ 2>/dev/null || true;
                 mv "$$LEGACY"/.[!.]* "$$DEST"/ 2>/dev/null || true;
                 rmdir "$$LEGACY" 2>/dev/null || true;
               else
                 echo "Keeping $$DEST; legacy $$LEGACY still present (not empty dest)";
               fi;
             fi;
             mkdir -p /tmp/monkeybot-workspace /tmp/monkeybot-skills /tmp/monkeybot-data "$$DEST";
             cp -rn /app/skills/. /tmp/monkeybot-skills/ 2>/dev/null || true;
             python -m monkeybot.gateway.main'
    depends_on:
      - opensandbox-server
