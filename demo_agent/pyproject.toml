[project]
name = "monkeybot-demo-agent"
version = "0.1.0"
description = "Self-contained demo agent showcasing the monkeybot harness — model providers, OpenSandbox, observability, Firestore, skills. Does not modify the harness itself."
requires-python = ">=3.11"
# google-genai is not listed here: it is installed via monkeybot[vertex] (Gemini provider
# and workspace/skills/image-generator). The sandbox worker image also preinstalls it.
dependencies = [
    "monkeybot[vertex,sandbox,observability,firestore,ollama,nvidia]",
    "anthropic[vertex]>=0.40.0",
    "ddgs>=9.14.4",
]

[tool.uv.sources]
monkeybot = { path = "..", editable = true }
