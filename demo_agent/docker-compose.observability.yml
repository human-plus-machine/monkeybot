# Demo observability: Phoenix + OTel Collector (+ Langfuse via docker-compose.langfuse.yml).
#
#   docker compose -f docker-compose.langfuse.yml -f docker-compose.observability.yml up -d
#
# Phoenix UI:     http://localhost:6006
# Langfuse UI:    http://localhost:3000
# OTLP ingest:    http://localhost:4318  (monkeybot OTEL_EXPORTER_OTLP_ENDPOINT)

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: mb-demo-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    environment:
      PHOENIX_PORT: "6006"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mb-demo-otel-collector
    restart: unless-stopped
    depends_on:
      - phoenix
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318"
    volumes:
      - ${OTEL_COLLECTOR_CONFIG_HOST:-./monkeybot_config/otel-collector.demo.yaml}:/etc/otelcol/config.yaml:ro
    environment:
      LANGFUSE_OTEL_BASIC_AUTH: ${LANGFUSE_OTEL_BASIC_AUTH:-}
