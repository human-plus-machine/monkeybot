# Non-secret defaults for the SSE gateway. Paths are relative to the process cwd.
# For a commented template to copy on first setup, see monkeybot.example.yaml in this directory.
# Secrets and per-machine overrides: use .env (loaded before this file is applied).
# Precedence: existing environment variables always win over values here.

runtime:
  log_level: INFO
  port: 8080

paths:
  agent_md: ./monkeybot_config/AGENT.md
  memory_path: ./data/memory
  skills_path: ./.agents/skills
  db_url: sqlite:///data/monkeybot.db
  mcp_config: ./monkeybot_config/mcp.json
  command_allowlist_config: ./monkeybot_config/command_allowlist.yaml

model:
  provider: gemini
  name: gemini-3-flash
  temperature: 0.7
  max_tokens: 60000
  thinking_budget: -1
  context_window: 1000000
  max_turns: 50

gateway:
  pending_response_timeout_sec: 300
  sse_replay_max: 256
  graceful_shutdown_timeout_sec: 5

context_curation:
  enabled: true
  skill_threshold: 4
  memory_threshold: 8
  curator_model: gemini-3-flash
  timeout_sec: 10
  max_memory_lines: 12
  max_skills: 5
  search_max_hits: 8

memory_hook:
  enabled: true

subagent:
  timeout_sec: 600
  max_turns: 25

web_search:
  backend: duckduckgo
  max_results: 5

sandbox:
  enabled: false
  server_url: http://localhost:8080
  image: python:3.12
  ttl_seconds: 1800

# Optional: merge additional files (paths relative to this file's directory).
# includes:
#   - includes/local.yaml
