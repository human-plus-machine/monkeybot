[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monkeybot-cli"
version = "0.1.1"
description = "CLI to create, configure, validate, and chat with MonkeyBot agents."
requires-python = ">=3.11"
dependencies = [
    "monkeybot",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
monkeybot = "monkeybot_cli.main:main"

[tool.uv.sources]
monkeybot = { path = "..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybot_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/monkeybot_cli/templates" = "monkeybot_cli/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
