[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monkeybot-cli"
version = "0.11.0"
description = "CLI to create, configure, validate, and chat with monkeybot agents."
requires-python = ">=3.11"
dependencies = [
    # `cli` pulls realtime + typer so `monkeybot talk` works out of the box (text mode).
    # Audio mic/PTT needs the agent (or this env) to also install monkeybot[cli-realtime].
    "monkeybot[cli]>=3.10.0,<4",
    "monkeybot-browser-mcp>=0.5.0,<1",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "textual>=8.2.8",
]

[project.scripts]
monkeybot = "monkeybot_cli.main:main"

[tool.uv]
# browser-harness 0.1.13 pins pillow==12.3.0, which is still inside the Pillow 13 advisory range.
# uv lock and uv sync honor this. uv tool install and uv pip install do not;
# those commands pass src/monkeybot_cli/overrides.txt via --overrides.
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
monkeybot = { path = "..", editable = true }
monkeybot-browser-mcp = { path = "../integrations/browser-mcp", editable = true }

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybot_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
