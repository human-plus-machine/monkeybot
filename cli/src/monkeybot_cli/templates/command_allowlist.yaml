# run_command: binary allowlist (enforced at execution).
allowed_commands:
  - cat
  - ls
  - grep
  - echo
  - python
  - python3
  - uv
  - git
  - gh
  - bash

# Path prefixes permitted in run_command argv (./ and / arguments).
allowed_path_prefixes:
  - ./data/memory/
  - ./data/memory
  - ./skills/
  - ./skills
  - ./test-data/
  - ./code/
  - ./code

# Optional: regexes matched against the normalized invocation (deny wins).
deny_patterns:
  - "^pip\\s+install"
  - "^curl\\s+"
  - "^wget\\s+"
  - "^rm\\s+-rf"
  - "^sudo\\s+"
  - ".*>\\s*/etc/.*"
