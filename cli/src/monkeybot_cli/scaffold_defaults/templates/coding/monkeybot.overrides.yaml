# Deep-merged over monkeybot.example.yaml by `monkeybot new --template coding`.
# Edit the generated monkeybot_config/monkeybot.yaml, not this file.
#
# Clone the repository into ./workspace. command_allowlist.yaml prefixes are
# resolved from paths.workspace_root, so ../memory is this agent's memory only
# while the workspace stays ./workspace. Pointing workspace_root at another
# directory requires updating those prefixes.

coding:
  # Reject a final answer that follows unverified edits, once per message.
  verification_gate:
    enabled: true

# Deterministic in-loop drift signals (no extra model calls except the goal ledger).
verifier:
  enabled: true
  ledger:
    enabled: true
  tracker:
    enabled: true
  judge:
    enabled: false
  escalation:
    max_severity: nudge

runtime:
  transcript_enabled: true

model:
  context_window: 200000
  max_turns: 100
