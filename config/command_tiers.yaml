# Ordered evaluation: first matching rule across all tiers wins.
tier_order:
  - name: safe
    action: allow
    patterns:
      - "^python\\s+skills/.*"
      - "^python\\s+subagents/.*"
      - "^cat\\s+"
      - "^ls\\s*"
  - name: restricted
    action: deny
    patterns:
      - "^pip\\s+install"
      - "^curl\\s+"
      - "^wget\\s+"
  - name: destructive
    action: deny
    patterns:
      - "^rm\\s+-rf"
      - "^sudo\\s+"
      - ".*>\\s*/etc/.*"
default: deny
