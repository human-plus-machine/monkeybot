# Sandbox overlay for the playground agent.
#
# Usage (from repo root):
#   docker compose --env-file playground/agent/.env \
#     -f docker-compose.playground.yml \
#     -f docker-compose.playground.sandbox.yml \
#     up --build
#
# Why /tmp/monkeybot-workspace:
#   SandboxExecutor tells OpenSandbox to bind-mount the agent's workspace path
#   on the HOST Docker daemon. /app/workspace only exists inside the monkeybot
#   container, not on the host. Using /tmp means:
#     - the same path is mounted into the container AND visible to the host daemon
#     - opensandbox allowed_host_paths already includes /tmp
#   Skills are copied from the image-baked /app/workspace/skills at startup.

services:
  opensandbox-server:
    image: opensandbox/server:latest
    environment:
      - OPENSANDBOX_INSECURE_SERVER=YES
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENSANDBOX_CONFIG:-./playground/agent/monkeybot_config/opensandbox.docker.toml}:/etc/opensandbox/config.toml:ro
    restart: unless-stopped

  monkeybot:
    build:
      args:
        EXTRAS: "vertex,web-search,sandbox"
    environment:
      - SANDBOX_ENABLED=true
      - SANDBOX_SERVER_URL=http://opensandbox-server:8080
      - MONKEYBOT_WORKSPACE_ROOT=/tmp/monkeybot-workspace
      - SKILLS_PATH=/tmp/monkeybot-workspace/skills
      - DB_URL=sqlite:////tmp/monkeybot-workspace/data/monkeybot.db
      - MEMORY_STORAGE_URI=local:///tmp/monkeybot-workspace/data/memory
    volumes:
      - /tmp/monkeybot-workspace:/tmp/monkeybot-workspace
    command: >
      sh -c "mkdir -p /tmp/monkeybot-workspace/skills /tmp/monkeybot-workspace/data/memory &&
             cp -rn /app/workspace/skills/. /tmp/monkeybot-workspace/skills/ 2>/dev/null || true &&
             python -m monkeybot.gateway.main"
    depends_on:
      - opensandbox-server
