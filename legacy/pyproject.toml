[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monkeybot"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.0",
    "ulid-py>=1.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.8"]
claude = ["anthropic>=0.30"]
vertex = ["anthropic[vertex]>=0.30"]
openai = ["openai>=1.0"]
gchat = ["fastapi>=0.110", "uvicorn>=0.29", "google-auth>=2.0", "google-auth-httplib2>=0.2"]
scheduler = ["croniter>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
monkeybot = "monkeybot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
