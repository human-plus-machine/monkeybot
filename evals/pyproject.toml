[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeybot-evals"
version = "0.1.0"
description = "T3 quality eval service (FastAPI + deepeval + Langfuse) for monkeybot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "deepeval>=3.0.0",
    "langfuse>=3.0.0",
]

[tool.setuptools]
py-modules = [
    "main",
    "models",
    "store",
    "runner",
    "scorer",
    "ws_manager",
    "assertions",
    "persistence",
    "report",
    "scenario_loader",
]
