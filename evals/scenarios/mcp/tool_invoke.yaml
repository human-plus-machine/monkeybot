# Requires an MCP server configured on the agent under test (e.g. monkeybot_config_example/mcp.example.json
# with browser-mcp wired up) and MODEL_PROVIDER pointed at a real model that can pick an MCP tool.
# Not part of the CI smoke suite yet — no in-process MCP fixture exists in the workflow (see
# docs/eval-pr-scorecard.md, "MCP strategy"). Run locally with `tags: [local-only]` scenarios included.
description: "Agent invokes an MCP-provided tool (e.g. browser MCP) when asked to use it"
tags: [mcp, local-only]
messages:
  - "You have an MCP browser tool available. Use it to check what tools you currently have connected, and list their names."
assertions:
  metrics: [response_relevancy]
  min_tool_calls: 1
