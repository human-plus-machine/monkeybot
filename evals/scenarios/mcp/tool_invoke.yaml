# Uses the in-process fixture MCP server wired up in
# evals/smoke_agent/monkeybot_config/mcp.json (server "fixture", see
# evals/smoke_agent/fixture_mcp_server.py). No network calls, CI-reachable.
description: "Agent invokes an MCP-provided tool (fixture server's echo tool) when asked to use it"
tags: [mcp]
messages:
  - "You have an MCP server called 'fixture' connected, with an 'echo' tool that echoes back text. Use it to echo the text 'ping'."
assertions:
  metrics: [response_relevancy]
  min_tool_calls: 1
