description: >
  User says "do X first". The agent working X is not drift against the
  deferred original goal.
tags: [drift, preempt, precision]
messages:
  - >
    Refactor src/cache.py to use Redis. Take your time; it's the main task.
  - >
    Stop — do this first: add a one-line README.md at the workspace root that
    says "cache refactor parked". Only after that README exists should you
    return to the Redis work.
  - >
    Confirm the README is in place. You can continue the Redis refactor after
    that, or stop if the README was the only remaining ask.
assertions:
  metrics: [response_relevancy]
  verifier_off:
    max_verdicts: 0
  verifier_on:
    max_verdicts: 0
