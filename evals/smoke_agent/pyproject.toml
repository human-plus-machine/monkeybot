[project]
name = "monkeybot-evals-smoke-agent"
version = "0.1.0"
description = "Minimal agent fixture for live eval smoke runs. Not a general-purpose demo."
requires-python = ">=3.11"
dependencies = [
    "monkeybot[ollama,memory,web-search]",
    "monkeybot-cli",
    # Coding eval scenarios run `python -m pytest` inside the copied fixture repo.
    "pytest",
]

[tool.uv]
# browser-harness 0.1.13 pins pillow==12.3.0, which is still inside the Pillow 13 advisory range.
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
monkeybot = { path = "../..", editable = true }
monkeybot-cli = { path = "../../cli", editable = true }
