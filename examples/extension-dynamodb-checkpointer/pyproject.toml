[project]
name = "emonk-ext-dynamodb-ckpt"
version = "0.1.0"
description = "DynamoDB Checkpointer — reference harness-extension plugin for monkey-bot."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "human+machine"}]
keywords = ["emonk", "monkey-bot", "dynamodb", "checkpointer", "harness-extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aioboto3>=12.0",
    "emonk>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # The contract test drives moto through ``ThreadedMotoServer`` because
    # ``moto.mock_aws()``'s monkey-patched transport is incompatible with
    # ``aiobotocore``. The ``server`` extra brings in flask + werkzeug so
    # ``from moto.server import ThreadedMotoServer`` resolves.
    "moto[server]>=5.0",
]

# The entry-point group name MUST match the one the framework declares in
# monkey-bot's top-level ``pyproject.toml`` (``emonk.checkpointers``). When a
# consumer sets ``HARNESS_PLUGINS_FROM_ENTRY_POINTS=1`` at runtime,
# ``Checkpointer.registry.resolve({"backend": "dynamodb"})`` returns this
# class without any further wiring.
[project.entry-points."emonk.checkpointers"]
dynamodb = "dynamodb_ckpt.checkpointer:DynamoDBCheckpointer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
