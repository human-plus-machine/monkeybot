description: "Multi-step task request triggers todo_list tool to track work items"
user_message: "Track a todo to write the release notes for this project."
scripted_turns:
  - - type: tool_call
      call_id: c1
      name: todo_list
      args:
        action: "add"
        text: "Write release notes"
    - type: done
  - - type: text_delta
      text: "Added 'Write release notes' to the todo list."
    - type: done
assertions:
  tool_categories_used:
    - todo
  turn_completed: true
  max_turns: 3
