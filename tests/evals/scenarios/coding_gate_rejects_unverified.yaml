description: "An edit followed by a bare 'done' is refused once; the retry verifies and reports the result"
executor: real
gate: true
workspace_fixture: fixtures/coding/calc_repo
user_message: "Add a power() helper to calc/ops.py."
scripted_turns:
  - - type: tool_call
      call_id: c1
      name: read_file
      args:
        path: calc/ops.py
    - type: done
  - - type: tool_call
      call_id: c2
      name: replace_in_file
      args:
        path: calc/ops.py
        old_string: "def divide(a: float, b: float) -> float:\n"
        new_string: "def power(a: float, b: float) -> float:\n    return a**b\n\n\ndef divide(a: float, b: float) -> float:\n"
    - type: done
  - - type: text_delta
      text: "Added power(). All done!"
    - type: done
  - - type: tool_call
      call_id: c3
      name: run_command
      args:
        argv: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-k", "not divide_by_zero"]
    - type: done
  - - type: text_delta
      text: "Added power(); verified with pytest -k 'not divide_by_zero': 4 passed (the unrelated divide-by-zero test still fails)."
    - type: done
assertions:
  interventions:
    - final_answer_gate
  provider_calls: 5
  workspace_file_contains:
    calc/ops.py: "def power("
  turn_completed: true
  no_errors: true
  max_turns: 8
