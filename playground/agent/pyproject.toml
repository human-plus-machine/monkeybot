[project]
name = "monkeybot-playground-agent"
version = "0.1.0"
description = "Sample agent (prompt + paths) using the monkeybot package — run as the backend beside playground/chat-ui."
requires-python = ">=3.11"
# google-genai is not listed here: it is installed via monkeybot[vertex] (Gemini provider
# and workspace/skills/image-generator). The sandbox worker image also preinstalls it.
dependencies = [
    "monkeybot[vertex,sandbox,observability,firestore,ollama]",
    "anthropic[vertex]>=0.40.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
]

[tool.uv.sources]
monkeybot = { path = "../..", editable = true }
