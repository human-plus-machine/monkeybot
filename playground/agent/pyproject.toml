[project]
name = "monkeybot-playground-agent"
version = "0.1.0"
description = "Sample agent (prompt + paths) using the monkeybot package — run as the backend beside playground/chat-ui."
requires-python = ">=3.11"
dependencies = [
    "monkeybot[vertex,sandbox,observability,firestore]",
    "anthropic[vertex]>=0.40.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
]

[tool.uv.sources]
monkeybot = { path = "../..", editable = true }
