allowed_commands:
  - cat
  - ls
  - grep
  - echo
  - python
  - python3
  - uv
  - git
  - gh
  - bash

allowed_path_prefixes:
  - ./data/memory/
  - ./data/memory
  - ./skills/
  - ./skills
  - ./generated-media/
  - ./generated-media
  - ./test-data/
  - ./code/
  - ./code

deny_patterns:
  - "pip3?\\s+install"
  - "python3?\\s+-m\\s+pip\\s+install"
  - "(^|\\s)uv\\s+(add|remove|sync|pip\\s+install|pip\\s+sync)"
  - "(^|\\s)poetry\\s+(add|install)"
  - "(^|\\s)conda\\s+install"
  - "(^|\\s)(npm|pnpm|yarn)\\s+(install|add|i)(\\s|$)"
  - "(^|\\s)(apt|apt-get)\\s+install"
  - "(^|\\s)brew\\s+install"
