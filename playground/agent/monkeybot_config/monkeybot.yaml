# Playground defaults when ``uv run`` cwd is ``playground/agent/``.
# Template with comments: monkeybot.example.yaml in this directory.
# Override with .env or environment variables as needed.
#
# Agent-facing files live under ``./workspace`` (``data/``, ``skills/``); harness config stays
# in ``./monkeybot_config/``. The playground workspace API lists only ``workspace/``.

runtime:
  log_level: INFO
  port: 8787

paths:
  agent_md: ./monkeybot_config/AGENT.md
  memory_storage_uri: local://./workspace/data/memory
  skills_path: ./workspace/skills
  workspace_root: ./workspace
  db_url: sqlite:///./workspace/data/monkeybot.db
  # Firestore (opt-in): uncomment below and install monkeybot[firestore]. run.sh starts the
  # emulator on :8686 when db_url uses firestore:// (see FIRESTORE_EMULATOR_HOST).
  # db_url: firestore://monkeybot-playground/(default)?prefix=playground
  mcp_config: ./monkeybot_config/mcp.json
  command_allowlist_config: ./monkeybot_config/command_allowlist.yaml

model:
  provider: vertex
  name: gemini-3-flash-preview
  # provider: vertex-claude
  # name: claude-sonnet-4-6
  # summarization_model: gemini-3-flash-preview  # optional; env CONTEXT_SUMMARIZATION_MODEL overrides

# GCP project: set GOOGLE_CLOUD_PROJECT (+ GOOGLE_APPLICATION_CREDENTIALS) in .env.
# Do not put project_id here unless you are not using .env — yaml fills VERTEX_AI_PROJECT_ID
# and overrides GOOGLE_CLOUD_PROJECT when both are present.

anthropic_vertex:
  region: us-east5

gateway:
  pending_response_timeout_sec: 300
  sse_replay_max: 256
  graceful_shutdown_timeout_sec: 5
  # Sets MONKEYBOT_CORS_ALLOW_ORIGINS (comma-separated, or "*"). Env overrides; Vite dev is localhost:5173.
  cors_allow_origins: "http://localhost:5173,http://127.0.0.1:5173"

context_curation:
  enabled: true
  skill_threshold: 4
  memory_threshold: 8
  curator_model: gemini-3-flash-preview
  timeout_sec: 10
  max_memory_lines: 12
  max_skills: 5
  search_max_hits: 8

memory_hook:
  enabled: true

subagent:
  timeout_sec: 600
  max_turns: 25
  agent_md: ./monkeybot_config/AGENT.md

web_search:
  backend: duckduckgo
  max_results: 5

sandbox:
  enabled: true
  server_url: http://localhost:18080
  # Built by run.sh from docker/Dockerfile.playground-sandbox (google-genai for image-generator).
  image: monkeybot-playground-sandbox:local
  ttl_seconds: 1800
