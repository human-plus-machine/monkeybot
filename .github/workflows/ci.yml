# Automatic runs are off. Pushing a branch runs this same suite locally
# (scripts/ci-local.sh via the pre-push hook). Dispatch this workflow from the
# Actions tab only when you want a GitHub-hosted run.
name: CI

on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep and GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ripgrep gh

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --extra claude --extra vertex-claude --extra bedrock --extra firestore

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/monkeybot testkit

      # §9 cassette-staleness: the reminder is a PR that touches any uv.lock.
      # This workflow stays workflow_dispatch (D2), so the step runs on every
      # dispatch. No provider key. scripts/ci-local.sh runs the same command.
      - name: cassette-staleness
        run: uv run python -m regression.t3.tools.check_staleness

      - name: Pytest
        run: uv run pytest tests regression -m "t1 or t2 or t3" -q -n auto

      - name: CLI pytest
        working-directory: cli
        run: |
          uv sync
          uv run pytest -q

      - name: Browser MCP pytest
        working-directory: integrations/browser-mcp
        run: |
          uv sync --dev
          # Root pytest.ini addopts load regression.plugin, which imports monkeybot.
          uv run pytest -q -o addopts= -p testkit.failure_ledger
