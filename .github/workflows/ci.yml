# Automatic runs are off. Pushing a branch runs this same suite locally
# (scripts/ci-local.sh via the pre-push hook). Dispatch this workflow from the
# Actions tab only when you want a GitHub-hosted run.
name: CI

on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep and GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ripgrep gh

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --extra claude --extra vertex-claude --extra bedrock --extra firestore

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/monkeybot testkit

      - name: Pytest
        run: uv run pytest tests regression -m "t1 or t2 or t3" -q -n auto

      - name: CLI pytest
        working-directory: cli
        run: |
          uv sync
          uv run pytest -q

      - name: Browser MCP pytest
        working-directory: integrations/browser-mcp
        run: |
          uv sync --dev
          uv run pytest -q

      - name: Evals self-checks (no live agent, no model calls)
        run: |
          uv sync --extra evals
          uv run python evals/test_assertions.py
          uv run python evals/test_report.py
          uv run python evals/test_runner_sse.py
          uv run python evals/test_coding_hard_oracle.py
