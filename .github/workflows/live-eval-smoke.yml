name: Live eval smoke

# Runs the live eval smoke suite (see docs/live-evals.md) and posts a Markdown
# scorecard. Manual only (Actions tab -> Live eval smoke -> Run workflow): live runs
# happen locally (decision D1), and GitHub has no provider key, so an automatic trigger
# would only report an empty scorecard.
# The scorecard lands on the workflow run's Summary page. The run JSON is uploaded as
# an artifact — download two of them and
# compare with `uv run python -m regression.t4.diff <old.json> <new.json>`.
#
# Cost/time budget: smoke suite is 12 scenarios x 2-5 turns x (agent call + judge call),
# paced by EVAL_SCENARIO_DELAY_SEC=150 between scenarios to stay under the current
# model's provider rate limit. Expect ~30-45 minutes per run (11 delays x 150s = 27.5 min
# of pacing alone, plus actual call time) — this is not stuck if it runs long; see
# timeout-minutes below.
#
# No provider key is passed to this workflow (decision D1): the live smoke suite runs
# locally with `uv run python -m regression.t4 --suite smoke`, reading the Ollama Cloud
# key from the shell or the repo-root .env. Here the suite's preflight finds no key and
# exits 2 with a run_error instead of skipping silently.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=false
          # Push to main and manual dispatch always run; PRs are gated below.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            run=true
          else
            if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "develop" ]]; then
              run=true
            fi
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            for f in uv.lock cli/uv.lock regression/t4/agent/uv.lock; do
              if grep -qxF "$f" <<<"$changed"; then
                run=true
              fi
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  live-eval:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 12 scenarios x ~150s inter-scenario delay (see EVAL_SCENARIO_DELAY_SEC) + run time,
    # plus headroom for checkout/uv sync/gateway boot and slow judge or subagent turns
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync root deps (regression/t4/report.py needs deepeval, langfuse)
        run: uv sync --extra evals

      - name: Sync agent project deps
        working-directory: regression/t4/agent
        run: uv sync

      - name: Boot monkeybot gateway (regression/t4/agent workspace)
        working-directory: regression/t4/agent
        env:
          # Agent model is YAML-only (regression/t4/agent/monkeybot_config/monkeybot.yaml).
          # The agent monkeybot.yaml sets runtime.port: 8080; the health check and
          # AGENT_URL below expect 8787, so pin PORT explicitly (env beats yaml).
          PORT: "8787"
          SANDBOX_ENABLED: "false" # no Docker socket in this runner
          # summarization_trigger is excluded from smoke; if it returns, set
          # model.context_window in the agent YAML (not MODEL_CONTEXT_WINDOW env).
        run: |
          uv run -m monkeybot.gateway.main > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy" >&2
          cat /tmp/gateway.log >&2
          exit 1

      - name: Run smoke suite report
        env:
          AGENT_URL: http://127.0.0.1:8787
          # The judge comes from regression/t4/eval_config.yaml.
          # Scorecard metadata: read the model the gateway ran from the agent YAML.
          MONKEYBOT_AGENT_CONFIG: regression/t4/agent/monkeybot_config/monkeybot.yaml
          EVENT_NAME: ${{ github.event_name }}
          # Each scenario itself makes several requests in quick succession, so space
          # scenarios out to stay under the provider's rate limit rather than trying to
          # throttle within one.
          EVAL_SCENARIO_DELAY_SEC: "150"
        run: |
          # PRs are a gate and must block on regressions; main pushes and manual runs
          # just score the build and always report. --fail-on-regression always blocks on
          # this run's own scenario errors/failures. It does NOT require
          # regression/t4/baselines/smoke.json to exist (that's the separate
          # --require-baseline flag, intentionally omitted below) — no trusted baseline has
          # been committed yet. Once one has
          # (`uv run python -m regression.t4 --suite smoke --update-baseline`, committed),
          # add --require-baseline here too so a missing/deleted file can't silently skip
          # the token/cost/latency drift checks.
          flags=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            flags="--fail-on-regression"
          fi
          uv run python -m regression.t4 \
            --suite smoke \
            --baseline regression/t4/baselines/smoke.json \
            $flags \
            | tee eval-report.md

      - name: Publish report to run summary
        if: always()
        run: |
          if [[ -f eval-report.md ]]; then
            cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`FAIL` — no report produced; see the job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.existsSync("eval-report.md")
              ? fs.readFileSync("eval-report.md", "utf8")
              : "## monkeybot Eval Scorecard\n\n`FAIL` — the report step did not complete " +
                "(gateway boot or the report command itself errored before writing a report). " +
                "See the workflow run logs for details.";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload run + report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-smoke-${{ github.run_id }}
          path: |
            regression/t4/runs/
            eval-report.md
          if-no-files-found: ignore

      - name: Stop gateway
        if: always()
        working-directory: regression/t4/agent
        run: kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true
