name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: publish-to-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: uv sync --extra dev --extra firestore --extra aws-enterprise --extra checkpointer-mongo

      - name: Run release regression tests
        run: |
          uv run pytest \
            tests/harness/test_assembler_deep_agent_wiring.py \
            tests/harness/test_build_universal_agent.py \
            tests/integration/test_full_stack_wiring.py \
            -v --no-cov

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import emonk; from emonk.core.harness import HarnessConfig; print(HarnessConfig.__name__)"

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -c "import emonk; from emonk.core.harness import HarnessConfig; print(HarnessConfig.__name__)"

      - name: Publish to PyPI
        run: uv publish
