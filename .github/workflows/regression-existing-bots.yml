name: regression-existing-bots

# Story 10 / Task 10.4 — feature-wide regression gate for the
# ``harness-extensibility`` feature.
#
# Triggers on every PR that touches the core harness or its extension
# subtree. Runs the three e2e tests that prove:
#
#   * examples/marketing-bot/harness.yaml still parses + builds with GCP
#     defaults (``tests/e2e/test_marketing_bot_regression.py``)
#   * examples/coding-bot/harness.yaml likewise
#     (``tests/e2e/test_coding_bot_regression.py``)
#   * A pre-feature config never silently gains new middleware
#     (``tests/e2e/test_zero_change_bot_configs.py``)

on:
  pull_request:
    paths:
      - 'src/core/harness/**'
      - 'src/core/harness/extensions/**'
      - 'examples/marketing-bot/**'
      - 'examples/coding-bot/**'
      - 'tests/e2e/test_marketing_bot_regression.py'
      - 'tests/e2e/test_coding_bot_regression.py'
      - 'tests/e2e/test_zero_change_bot_configs.py'
      - '.github/workflows/regression-existing-bots.yml'

jobs:
  test:
    name: regression-existing-bots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install harness + extensibility extras
        # The spec (Story 10 / Task 10.4) calls out
        # ``pip install -e .[test,bedrock,postgres,mongo,s3]``; the concrete
        # extras published in ``pyproject.toml`` are ``dev`` (test deps),
        # ``firestore`` (required by the marketing-bot / coding-bot defaults),
        # and ``aws-enterprise`` (bundles bedrock + postgres + mongo + s3).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,firestore,aws-enterprise,checkpointer-mongo]"
      - name: Run existing-bot regression suite
        run: |
          pytest \
            tests/e2e/test_marketing_bot_regression.py \
            tests/e2e/test_coding_bot_regression.py \
            tests/e2e/test_zero_change_bot_configs.py \
            -v --no-cov
