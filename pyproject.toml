[project]
name = "emonk"
version = "1.0.0"
description = "An opinionated agent framework built on LangChain Deep Agents — with pluggable cloud storage, sandbox execution, and a skills engine."
requires-python = ">=3.11"
authors = [
    {name = "human+machine"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["ai", "agent", "llm", "automation", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "deepagents>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-google-vertexai>=2.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=2.18.0",
]
firestore = [
    "google-cloud-firestore>=2.18.0",
]
modal = [
    "modal>=0.60.0",
]
voice = [
    "google-cloud-speech>=2.27.0",
    "google-cloud-texttospeech>=2.17.0",
]
vertex-anthropic = [
    "anthropic[vertex]>=0.40.0",
]
council = [
    "emonk[gcs]",
]
mcp = [
    "langchain-mcp-adapters>=0.1.0",
]
aws = [
    "boto3>=1.34.0",
]
harness = [
    "emonk[mcp]",
]
harness-full = [
    "emonk[harness]",
    "emonk[firestore]",
    "emonk[gcs]",
    "emonk[modal]",
    "emonk[aws]",
]
all = [
    "emonk[gcs]",
    "emonk[firestore]",
    "emonk[modal]",
    "emonk[voice]",
    "emonk[vertex-anthropic]",
    "emonk[council]",
    "emonk[mcp]",
    "emonk[aws]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.12",
]
# BEGIN harness-extensibility story 2
checkpointer-postgres = ["asyncpg>=0.29", "orjson>=3.9"]
checkpointer-mongo = ["motor>=3.3", "orjson>=3.9"]
# END harness-extensibility story 2
# BEGIN harness-extensibility story 3
memory-store-s3 = ["aioboto3>=12.0", "orjson>=3.9"]
memory-store-postgres = ["asyncpg>=0.29", "orjson>=3.9"]
memory-store-mongo = ["motor>=3.3", "orjson>=3.9"]
memory-store-pgvector = ["pgvector>=0.2"]
# END harness-extensibility story 3
# BEGIN harness-extensibility story 4
job-storage-postgres = ["asyncpg>=0.29", "orjson>=3.9"]
job-storage-mongo = ["motor>=3.3", "orjson>=3.9"]
job-storage-json = ["filelock>=3.13"]
# END harness-extensibility story 4
# BEGIN harness-extensibility story 5
identity-source-s3 = ["aioboto3>=12.0"]
identity-source-gcs = ["google-cloud-storage>=2.13"]
identity-source-postgres = ["asyncpg>=0.29"]
identity-source-mongo = ["motor>=3.3"]
# END harness-extensibility story 5
# BEGIN harness-extensibility story 6
secret-resolver-aws = ["aioboto3>=12.0"]
secret-resolver-gcp = ["google-cloud-secret-manager>=2.16"]
# END harness-extensibility story 6
# BEGIN harness-extensibility story 7
model-provider-bedrock = ["langchain-aws>=0.2", "boto3>=1.34"]
model-provider-openai = ["langchain-openai>=0.2"]
model-provider-anthropic = ["langchain-anthropic>=0.2"]
model-provider-ollama = ["langchain-ollama>=0.2"]
# END harness-extensibility story 7
# BEGIN harness-extensibility story 8
# Convenience bundle for the examples/aws-enterprise-agent reference deployment.
# Installing ``emonk[aws-enterprise]`` pulls every AWS-targeted backend at once
# (Postgres checkpointer + job storage, S3 memory + identity, AWS Secrets
# Manager resolver, Bedrock provider, plus the base boto3 extra).
aws-enterprise = [
    "emonk[aws]",
    "emonk[checkpointer-postgres]",
    "emonk[memory-store-s3]",
    "emonk[job-storage-postgres]",
    "emonk[identity-source-s3]",
    "emonk[secret-resolver-aws]",
    "emonk[model-provider-bedrock]",
]
# END harness-extensibility story 8

[project.urls]
Homepage = "https://github.com/auriga-os/monkey-bot"
Documentation = "https://github.com/auriga-os/monkey-bot#readme"
Repository = "https://github.com/auriga-os/monkey-bot"
Issues = "https://github.com/auriga-os/monkey-bot/issues"

[project.scripts]
emonk-harness = "emonk.core.harness.linter:main"

# BEGIN harness-extensibility story 1
[project.entry-points."emonk.checkpointers"]

[project.entry-points."emonk.memory_stores"]

[project.entry-points."emonk.job_storage"]

[project.entry-points."emonk.identity_sources"]

[project.entry-points."emonk.secret_resolvers"]

[project.entry-points."emonk.model_providers"]
# END harness-extensibility story 1

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "emonk",
    "emonk.core",
    "emonk.core.scheduler",
    "emonk.core.harness",
    "emonk.core.harness.middleware",
    "emonk.core.harness.sandbox",
    "emonk.core.harness.hitl",
    # BEGIN harness-extensibility story 1
    "emonk.core.harness.extensions",
    "emonk.core.harness.extensions.specs",
    "emonk.core.harness.extensions.testing",
    # END harness-extensibility story 1
    # BEGIN harness-extensibility story 2
    "emonk.core.harness.extensions.checkpointers",
    "emonk.core.harness.extensions.migrations",
    "emonk.core.harness.extensions.migrations.postgres",
    # END harness-extensibility story 2
    # BEGIN harness-extensibility story 3
    "emonk.core.harness.extensions.memory_stores",
    # END harness-extensibility story 3
    # BEGIN harness-extensibility story 4
    "emonk.core.harness.extensions.job_storage",
    # END harness-extensibility story 4
    # BEGIN harness-extensibility story 5
    "emonk.core.harness.extensions.identity_sources",
    # END harness-extensibility story 5
    # BEGIN harness-extensibility story 6
    "emonk.core.harness.extensions.secret_resolvers",
    # END harness-extensibility story 6
    # BEGIN harness-extensibility story 7
    "emonk.core.harness.extensions.model_providers",
    # END harness-extensibility story 7
    "emonk.backends",
    "emonk.gateway",
    "emonk.sandbox",
    "emonk.skills",
    "emonk.voice",
]
package-dir = {"emonk" = "src"}

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
# Allow missing imports for third-party libraries without stubs
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
