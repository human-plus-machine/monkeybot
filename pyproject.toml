[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monkeybot"
version = "2.0.0"
description = "MonkeyBot agent harness — FastAPI SSE gateway, owned loop, SQLite, and MCP."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "python-ulid>=2.0.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
vertex = [
    "google-genai>=1.0.0",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",
]
claude = ["anthropic>=0.40.0"]
vertex-claude = ["anthropic[vertex]>=0.40.0"]
bedrock = []
openai = ["openai>=1.0"]
scheduler = ["croniter>=2.0"]
langchain = [
    "langchain-core>=0.3.0",
    "langchain-google-vertexai>=2.0.0",
]
gcs = ["google-cloud-storage>=2.18.0"]
council = ["google-cloud-storage>=2.18.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.12",
    "asgi-lifespan>=2.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybot"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "build", "dist", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["monkeybot"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
ignore_missing_imports = true
