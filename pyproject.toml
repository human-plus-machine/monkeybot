[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monkeybot"
version = "2.1.0"
description = "monkeybot agent harness — FastAPI SSE gateway, owned loop, SQLite, and MCP."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "python-ulid>=2.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
vertex = [
    "google-genai>=1.0.0",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",
]
claude = ["anthropic>=0.40.0"]
vertex-claude = ["anthropic[vertex]>=0.40.0"]
bedrock = ["anthropic[bedrock]>=0.40.0", "boto3>=1.34.0"]
openai = ["openai>=1.0", "tiktoken>=0.7.0"]
huggingface = ["openai>=1.0", "tiktoken>=0.7.0"]
ollama = ["openai>=1.0", "tiktoken>=0.7.0"]
nvidia = ["openai>=1.0", "tiktoken>=0.7.0"]
sandbox = ["opensandbox>=0.1.7"]
scheduler = ["croniter>=2.0"]
postgres = ["asyncpg>=0.29.0"]
firestore = ["google-cloud-firestore>=2.16.0"]
gcs = ["google-cloud-storage>=2.18.0"]
aws = ["boto3>=1.34.0"]
council = ["google-cloud-storage>=2.18.0"]
web-search = ["ddgs>=7.0"]
# Live E2E eval report (evals/report.py). google-genai is required by deepeval's
# GeminiModel judge (not bundled with deepeval); harmless when the judge is OpenAI/Anthropic.
evals = ["deepeval>=3.0.0", "langfuse>=3.0.0", "google-genai>=1.0.0"]
realtime = ["websockets>=14.0"]
realtime-gemini = ["monkeybot[realtime]", "google-genai>=1.0.0"]
# Realtime talk helpers (imported by monkeybot-cli's `talk` subcommand).
# The user-facing `monkeybot` console script is provided by the monkeybot-cli package
# in cli/ — do not register a competing [project.scripts] entry here.
cli = ["monkeybot[realtime]", "typer>=0.12.0"]
cli-realtime = ["monkeybot[cli]", "pyaudio>=0.2.11", "pynput>=1.7.6"]
observability = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
]

[dependency-groups]
dev = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "tiktoken>=0.7.0",
    "types-pyyaml>=6.0.12",
    "asgi-lifespan>=2.1.0",
    "anthropic[vertex,bedrock]>=0.40.0",
    # Needed so `mypy src/monkeybot` can typecheck cli/main.py Typer decorators
    # without requiring --extra cli (CI syncs provider extras only).
    "typer>=0.12.0",
    # Shims in src/monkeybot/cli re-export from monkeybot_cli (talk consolidation).
    "monkeybot-cli",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
monkeybot-cli = { path = "cli", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybot"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "build", "dist", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["monkeybot"]

[tool.ruff.lint.per-file-ignores]
# ensure_gateway_runtime_env() must run before monkeybot imports read os.environ
"src/monkeybot/gateway/sse/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
ignore_missing_imports = true
