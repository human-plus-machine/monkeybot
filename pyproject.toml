[project]
name = "emonk"
version = "1.0.0"
description = "An opinionated agent framework built on LangChain Deep Agents — with pluggable cloud storage, sandbox execution, and a skills engine."
requires-python = ">=3.11"
authors = [
    {name = "ez-ai"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["ai", "agent", "llm", "automation", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "deepagents>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-vertexai>=2.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=2.18.0",
]
firestore = [
    "google-cloud-firestore>=2.18.0",
]
modal = [
    "modal>=0.60.0",
]
voice = [
    "google-cloud-speech>=2.27.0",
    "google-cloud-texttospeech>=2.17.0",
]
vertex-anthropic = [
    "anthropic[vertex]>=0.40.0",
]
council = [
    "emonk[gcs]",
]
all = [
    "emonk[gcs]",
    "emonk[firestore]",
    "emonk[modal]",
    "emonk[voice]",
    "emonk[vertex-anthropic]",
    "emonk[council]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/ez-ai/monkey-bot"
Documentation = "https://github.com/ez-ai/monkey-bot#readme"
Repository = "https://github.com/ez-ai/monkey-bot"
Issues = "https://github.com/ez-ai/monkey-bot/issues"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "emonk",
    "emonk.core",
    "emonk.core.scheduler",
    "emonk.backends",
    "emonk.gateway",
    "emonk.sandbox",
    "emonk.skills",
]
package-dir = {"emonk" = "src"}

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
# Allow missing imports for third-party libraries without stubs
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
