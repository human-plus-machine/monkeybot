[pytest]
# Only the v2 suite under ./tests (legacy/ mirrors old layout and also uses a
# top-level "tests" package name, which collides with ./tests on sys.path).
testpaths = tests
asyncio_mode = auto
markers =
    integration: Integration tests (includes E2E and routing tests)

addopts = -v --ignore=legacy

# To run only integration tests:
#   pytest -m integration
# To run only unit tests:
#   pytest -m "not integration"
