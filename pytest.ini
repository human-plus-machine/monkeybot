[pytest]
testpaths = tests regression
asyncio_mode = auto
pythonpath = .
markers =
    t1: deterministic unit and contract tests
    t2: scripted harness scenarios
    t3: record and replay
    t4: live agent
    t5: trials
    live: requires a live model or agent
    needs_postgres: requires Postgres
    needs_firestore: requires the Firestore emulator
    darwin_only: macOS only
    slow: long-running
    quarantine: excluded from the default gate
    case: catalog case id

addopts = -v -p testkit.failure_ledger -p pytester -p regression.plugin -p no:deepeval
