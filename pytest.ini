[pytest]
# Suite under ./tests
testpaths = tests
asyncio_mode = auto
pythonpath = .
markers =
    integration: Integration tests (includes E2E and routing tests)
    acceptance: Live acceptance tests (require external services or credentials)

addopts = -v

# To run only integration tests:
#   pytest -m integration
# To run only unit tests:
#   pytest -m "not integration"
