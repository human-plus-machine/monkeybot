services:
  evals:
    build: ./evals
    container_name: mb-evals
    ports:
      - "8001:8001"
    environment:
      AGENT_URL: http://monkeybot:8080
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-playground}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-playground}
      MONKEYBOT_AGENT_CONFIG: /config/monkeybot.yaml
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_creds
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_AI_PROJECT_ID: ${VERTEX_AI_PROJECT_ID:-}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-us-central1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_BEDROCK_REGION: ${AWS_BEDROCK_REGION:-}
    volumes:
      - ${GCP_AUTH_FILE:-/dev/null}:/run/secrets/gcp_creds:ro
      - ./playground/agent/monkeybot_config/monkeybot.yaml:/config/monkeybot.yaml:ro
      - ${OPERATOR_SCENARIOS_PATH:-./evals/scenarios/operator}:/app/scenarios/operator:ro
